<style>
.admin-wrap{max-width:900px;margin:1rem auto;padding:1rem}
.admin-header{background:linear-gradient(135deg,#0f3460,#e94560);color:#fff;padding:1.5rem;border-radius:14px;margin-bottom:1.5rem}
.admin-header h1{color:#fff;margin:0}
.login-box{background:#fff;padding:2rem;border-radius:14px;box-shadow:0 3px 15px rgba(0,0,0,.1);max-width:400px;margin:3rem auto}
.login-box h2{color:#0f3460;text-align:center;margin-bottom:1rem}
.login-box input{width:100%;padding:.9rem;border:2px solid #e0e6ed;border-radius:10px;margin-bottom:.8rem;font-size:1rem;box-sizing:border-box}
.login-box button{width:100%;padding:.9rem;background:#e94560;color:#fff;border:none;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer}
.admin-tabs{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1rem}
.admin-tabs button{padding:.6rem 1.2rem;border:2px solid #e0e6ed;background:#fff;border-radius:20px;cursor:pointer;font-weight:500}
.admin-tabs button.active{background:#e94560;color:#fff;border-color:#e94560}
.form-card{background:#fff;padding:1.5rem;border-radius:14px;box-shadow:0 3px 15px rgba(0,0,0,.08);margin-bottom:1rem}
.form-card label{display:block;font-weight:600;color:#0f3460;margin:.8rem 0 .3rem}
.form-card input,.form-card select{width:100%;padding:.7rem;border:2px solid #e0e6ed;border-radius:8px;font-size:.95rem;box-sizing:border-box}
.form-card button{margin-top:1rem;padding:.8rem 1.5rem;background:#27ae60;color:#fff;border:none;border-radius:10px;cursor:pointer;font-weight:600;font-size:1rem}
.toast-msg{padding:1rem;border-radius:10px;margin:1rem 0;display:none}
.toast-msg.success{background:#d4edda;color:#155724;display:block}
.toast-msg.error{background:#f8d7da;color:#721c24;display:block}
.item-list{background:#f8fafc;border-radius:10px;padding:1rem;margin-top:1rem;max-height:400px;overflow-y:auto}
.item-row{display:flex;align-items:center;gap:.5rem;padding:.6rem;border-bottom:1px solid #e0e6ed}
.item-row .title{flex:1;font-size:.9rem}
.item-row .type{background:#e8f4ff;color:#0f3460;padding:.15rem .5rem;border-radius:8px;font-size:.75rem}
.item-row .del{background:#e74c3c;color:#fff;border:none;width:28px;height:28px;border-radius:50%;cursor:pointer}
.info-banner{background:#fff3cd;border-left:4px solid #f39c12;padding:1rem;border-radius:10px;margin-bottom:1rem;font-size:.9rem}
</style>

<body>
<header>
<div class="top-bar">🔐 Admin Panel</div>
<nav>
<a href="index.html" style="display:flex;align-items:center;gap:0.5rem;text-decoration:none;flex-shrink:0">
<img src="assets/images/logo.svg" alt="The Ravishankar Insights" style="height:48px;width:auto;max-width:58px;object-fit:contain;filter:drop-shadow(0 2px 6px rgba(0,0,0,0.4))" loading="eager" class="header-logo-img">
      <div class="brand-text" style="display:flex !important;flex-direction:column !important;line-height:1.05 !important;margin-left:0.5rem !important;padding-left:0.5rem !important;border-left:2px solid rgba(255,215,0,0.6) !important;flex:1 1 auto !important;max-width:160px !important;justify-content:center !important">
<div class="brand-line-1" style="display:block !important;font-size:0.62rem !important;font-weight:600 !important;color:#ffd700 !important;-webkit-text-fill-color:#ffd700 !important;letter-spacing:2px !important;text-transform:uppercase !important;margin-bottom:0.1rem !important;white-space:nowrap !important;text-shadow:0 1px 2px rgba(0,0,0,0.4) !important;background:none !important">THE</div>
<div class="brand-line-2" style="display:block !important;font-family:Georgia,serif !important;font-size:1.05rem !important;font-weight:700 !important;color:#ffffff !important;-webkit-text-fill-color:#ffffff !important;letter-spacing:0.3px !important;white-space:nowrap !important;line-height:1.15 !important;text-shadow:0 1px 3px rgba(0,0,0,0.5), 0 0 8px rgba(255,215,0,0.4) !important;background:none !important">Ravishankar</div>
<div class="brand-line-3" style="display:block !important;font-size:0.58rem !important;color:#ffd700 !important;-webkit-text-fill-color:#ffd700 !important;letter-spacing:2.8px !important;text-transform:uppercase !important;margin-top:0.1rem !important;white-space:nowrap !important;font-weight:600 !important;text-shadow:0 1px 2px rgba(0,0,0,0.4) !important;background:none !important">INSIGHTS</div>
</div>
<div id="tab-manage" style="display:none">
<div class="form-card">
<label>Exam</label>
<select id="manageExam"></select>
<label>📂 Type</label>
<select id="manageType">
<option value="notes">📝 Notes</option>
<option value="pyq">📄 PYQ</option>
<option value="syllabus">Syllabus</option>
<option value="videos">🎥 Videos</option>
<option value="books">📖 Books</option>
</select>
<div class="item-list" id="itemList">Loading...</div>
</div>
</div>
<div id="tab-help" style="display:none">
<div class="form-card">
<h3>🔑 GitHub Token कैसे बनाएँ?</h3>
<ol style="line-height:2">
<li><a href="https://github.com/settings/tokens/new" target="_blank">github.com/settings/tokens</a> खोलें</li>
<li>Note: admin-panel</li>
<li>Expiration: No expiration</li>
<li>Scopes: ✅ repo tick करें</li>
<li>Generate token → copy</li>
<li>ऊपर paste करें</li>
</ol>
</div>
</div>
</div>
</div>
</main>
<script>
var ADMIN_PASSWORD = 'Ravishankar@2026';
var GITHUB_REPO = 'ravishankarkamal59-eng/ravishankarkamal59-eng.github.io';
var resourcesData = null;

var EXAM_NAMES = {
  'upsc': 'UPSC', 'bpsc': 'BPSC', 'ssc-cgl': 'SSC CGL', 'ssc-chsl': 'SSC CHSL',
  'ssc-mts': 'SSC MTS', 'ssc-gd': 'SSC GD', 'railway': 'Railway', 'banking': 'Banking',
  'jee-mains': 'JEE Mains', 'neet': 'NEET', 'llb': 'LLB', 'cat-mba': 'CAT/MBA',
  'gate': 'GATE', 'b-ed': 'B.Ed', 'nda-cds': 'NDA/CDS', 'bca-mca': 'BCA/MCA',
  'nursing': 'Nursing', 'cuet': 'CUET', 'ctet': 'CTET', 'bihar-police': 'बिहार पुलिस',
  'up-police': 'UP Police', 'mppsc': 'MPPSC', 'ras': 'RAS', 'bihar-si': 'बिहार SI',
  'up-lekhpal': 'UP लेखपाल', 'jpsc': 'JPSC', 'ukpsc': 'UKPSC', 'uppcs': 'UPPCS',
  'pet': 'PET', 'ba-ma': 'BA/MA'
};

function login() {
  var pass = document.getElementById('adminPass').value;
  if (pass === ADMIN_PASSWORD) {
    localStorage.setItem('adminLoggedIn', 'yes');
    showAdmin();
  } else {
    document.getElementById('loginError').textContent = '❌ गलत पासवर्ड';
  }
}

function showAdmin() {
  document.getElementById('loginBox').style.display = 'none';
  document.getElementById('adminContent').style.display = 'block';
  var lb = document.getElementById('logoutBtn');
  lb.style.display = 'inline';
  lb.onclick = function(e) {
    e.preventDefault();
    localStorage.removeItem('adminLoggedIn');
    location.reload();
  };
  loadResources();
}

function showTab(tab, btn) {
  var tabs = document.querySelectorAll('.admin-tabs button');
  for (var i = 0; i < tabs.length; i++) tabs[i].classList.remove('active');
  btn.classList.add('active');
  var names = ['add', 'manage', 'help'];
  for (var j = 0; j < names.length; j++) {
    document.getElementById('tab-' + names[j]).style.display = names[j] === tab ? 'block' : 'none';
  }
}

function saveToken() {
  var t = document.getElementById('ghToken').value.trim();
  var u = document.getElementById('ghUser').value.trim();
  if (!t || !u) { alert('Token और Username दोनों डालें'); return; }
  localStorage.setItem('ghToken', t);
  localStorage.setItem('ghUser', u);
  document.getElementById('tokenStatus').textContent = '✅ Token saved';
}

function loadResources() {
  fetch('data/resources.json?v=' + Date.now())
    .then(function(r) { return r.json(); })
    .then(function(data) {
      resourcesData = data;
      populateManageExams();
      loadItems();
    })
    .catch(function(e) { console.error('Load error:', e); });
}

function populateManageExams() {
  var sel = document.getElementById('manageExam');
  sel.innerHTML = '';
  for (var key in EXAM_NAMES) {
    var opt = document.createElement('option');
    opt.value = key;
    opt.textContent = EXAM_NAMES[key];
    sel.appendChild(opt);
  }
}

function loadItems() {
  if (!resourcesData) return;
  var ex = document.getElementById('manageExam').value;
  var ty = document.getElementById('manageType').value;
  var items = (resourcesData[ex] && resourcesData[ex][ty]) || [];
  var c = document.getElementById('itemList');
  if (!items.length) {
    c.innerHTML = '<p style="text-align:center;color:#999;padding:1rem">कोई item नहीं है।</p>';
    return;
  }
  var html = '';
  for (var i = 0; i < items.length; i++) {
    html += '<div class="item-row">';
    html += '<span class="title">' + items[i].title + '</span>';
    html += '<span class="type">' + (items[i].type || 'PDF') + '</span>';
    html += '<button class="del" data-ex="' + ex + '" data-ty="' + ty + '" data-idx="' + i + '">×</button>';
    html += '</div>';
  }
  c.innerHTML = html;
  var dels = c.querySelectorAll('.del');
  for (var k = 0; k < dels.length; k++) {
    dels[k].onclick = function() {
      deleteItem(this.dataset.ex, this.dataset.ty, parseInt(this.dataset.idx));
    };
  }
}

function addResource() {
  var tk = localStorage.getItem('ghToken');
  var us = localStorage.getItem('ghUser');
  if (!tk || !us) { showMsg('addMsg', '❌ पहले GitHub Token save करें', 'error'); return; }
  var ex = document.getElementById('examSelect').value;
  var ty = document.getElementById('typeSelect').value;
  var ti = document.getElementById('titleInput').value.trim();
  var li = document.getElementById('linkInput').value.trim();
  if (!ti || !li) { showMsg('addMsg', '❌ Title और Link दोनों भरें', 'error'); return; }
  if (!resourcesData[ex]) resourcesData[ex] = { name: ex, notes: [], pyq: [], syllabus: [], videos: [], books: [] };
  if (!resourcesData[ex][ty]) resourcesData[ex][ty] = [];
  var itemType = ty === 'videos' ? 'Video' : (ty === 'books' ? 'Book' : 'PDF');
  resourcesData[ex][ty].push({ title: ti, link: li, type: itemType });
  showMsg('addMsg', '⏳ Saving...', 'success');
  pushToGitHub(resourcesData, 'Add ' + ty + ' for ' + ex + ': ' + ti).then(function(ok) {
    if (ok) {
      showMsg('addMsg', '✅ Success! 30 सेकंड में live।', 'success');
      document.getElementById('titleInput').value = '';
      document.getElementById('linkInput').value = '';
      loadItems();
    } else {
      showMsg('addMsg', '❌ Error! Token check करें।', 'error');
    }
  });
}

function deleteItem(ex, ty, i) {
  if (!confirm('Delete करना है?')) return;
  var tk = localStorage.getItem('ghToken');
  if (!tk) { alert('Token save करें'); return; }
  resourcesData[ex][ty].splice(i, 1);
  pushToGitHub(resourcesData, 'Delete from ' + ex).then(function(ok) {
    if (ok) { loadItems(); alert('✅ Deleted'); }
    else { alert('❌ Error'); }
  });
}

function pushToGitHub(data, msg) {
  var tk = localStorage.getItem('ghToken');
  var us = localStorage.getItem('ghUser');
  var api = 'https://api.github.com/repos/' + GITHUB_REPO + '/contents/data/resources.json';
  return fetch(api + '?t=' + Date.now(), { headers: { 'Authorization': 'token ' + tk } })
    .then(function(r) { return r.json(); })
    .then(function(cur) {
      var content = btoa(unescape(encodeURIComponent(JSON.stringify(data, null, 2))));
      return fetch(api, {
        method: 'PUT',
        headers: { 'Authorization': 'token ' + tk, 'Content-Type': 'application/json' },
        body: JSON.stringify({
          message: msg,
          content: content,
          sha: cur.sha,
          committer: { name: 'Admin', email: us + '@users.noreply.github.com' }
        })
      });
    })
    .then(function(p) { return p.ok; })
    .catch(function(e) { console.error(e); return false; });
}

function showMsg(id, txt, cls) {
  var e = document.getElementById(id);
  e.textContent = txt;
  e.className = 'toast-msg ' + cls;
}

// Event listeners — DOMContentLoaded से बाद
document.addEventListener('DOMContentLoaded', function() {
  document.getElementById('loginBtn').addEventListener('click', login);
  document.getElementById('adminPass').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') login();
  });
  document.getElementById('saveTokenBtn').addEventListener('click', saveToken);
  document.getElementById('addBtn').addEventListener('click', addResource);
  document.getElementById('manageExam').addEventListener('change', loadItems);
  document.getElementById('manageType').addEventListener('change', loadItems);

  // Tabs
  var tabBtns = document.querySelectorAll('.admin-tabs button');
  for (var i = 0; i < tabBtns.length; i++) {
    tabBtns[i].addEventListener('click', function() {
      showTab(this.dataset.tab, this);
    });
  }

  // Check saved state
  var savedToken = localStorage.getItem('ghToken');
  if (savedToken) {
    document.getElementById('ghToken').value = savedToken;
    document.getElementById('tokenStatus').textContent = '✅ Token saved';
  }
  if (localStorage.getItem('adminLoggedIn') === 'yes') {
    showAdmin();
  }
});
</script>
<script src="assets/js/mobile-header-fix.js"></script>
<!-- SW-UNREGISTER -->
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(function(regs) {
    regs.forEach(function(reg) { reg.unregister(); });
  });
  if ('caches' in window) {
    caches.keys().then(function(names) {
      names.forEach(function(name) { caches.delete(name); });
    });
  }
}
</script>
</body>
