<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<title>भारत की नदियाँ - Professional Video</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: 'Segoe UI', 'Nirmala UI', Arial, sans-serif; background:#000; overflow:hidden; }
  .stage { width:100vw; height:100vh; position:relative; overflow:hidden; }

  /* Animated Background */
  .bg-layer { position:absolute; inset:0; background: linear-gradient(135deg, #0a1929 0%, #0f3460 35%, #1a5276 70%, #0a1929 100%); background-size: 400% 400%; animation: gradientShift 12s ease infinite; }
  @keyframes gradientShift { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }

  .ripples { position:absolute; inset:0; opacity:0.2; background-image: radial-gradient(circle at 20% 30%, rgba(100,200,255,0.4) 0%, transparent 25%), radial-gradient(circle at 80% 70%, rgba(100,200,255,0.3) 0%, transparent 30%); animation: rippleMove 18s ease-in-out infinite; }
  @keyframes rippleMove { 0%, 100% { transform: scale(1) rotate(0deg); } 50% { transform: scale(1.2) rotate(5deg); } }

  .particles { position:absolute; inset:0; overflow:hidden; }
  .particle { position:absolute; width:4px; height:4px; background:rgba(100,200,255,0.7); border-radius:50%; animation: floatUp linear infinite; box-shadow: 0 0 10px rgba(100,200,255,0.8); }
  @keyframes floatUp { from { transform: translateY(100vh) scale(0); opacity:0; } 10% { opacity:1; } 90% { opacity:1; } to { transform: translateY(-100px) scale(1); opacity:0; } }

  /* Top Logo Bar */
  .top-bar { position:fixed; top:0; left:0; right:0; padding:14px 40px; display:flex; justify-content:space-between; align-items:center; z-index:1000; background: linear-gradient(180deg, rgba(0,0,0,0.7), transparent); }
  .top-logo { display:flex; align-items:center; gap:10px; }
  .top-logo-icon { width:42px; height:42px; background: linear-gradient(135deg,#FDBA3B,#FB5D3B); border-radius:10px; display:flex; align-items:center; justify-content:center; font-family: Georgia, serif; font-weight:900; font-size:24px; color:#0a1929; box-shadow: 0 4px 15px rgba(253,186,59,0.5); }
  .top-logo-text { color:#fff; display:flex; flex-direction:column; line-height:1.1; }
  .top-logo-text .small { font-size:10px; color:#FDBA3B; font-weight:700; letter-spacing:3px; }
  .top-logo-text .big { font-size:16px; font-weight:900; font-family: Georgia, serif; }
  .slide-counter { background: rgba(0,0,0,0.5); color:#fff; padding:8px 18px; border-radius:25px; font-size:14px; font-weight:700; letter-spacing:1px; backdrop-filter: blur(10px); border:1px solid rgba(255,255,255,0.2); }

  /* Slides */
  .slides-container { position:absolute; inset:0; padding:90px 80px 130px 80px; }
  .slide { position:absolute; top:90px; left:80px; right:80px; bottom:130px; display:flex; flex-direction:column; justify-content:center; opacity:0; transform:translateY(30px); transition: all 0.9s cubic-bezier(0.4, 0, 0.2, 1); pointer-events:none; }
  .slide.active { opacity:1; transform:translateY(0); pointer-events:auto; }

  .slide-number { display:inline-block; background: linear-gradient(135deg,#FDBA3B,#FB5D3B); color:#0a1929; padding:6px 18px; border-radius:25px; font-size:14px; font-weight:800; letter-spacing:2px; margin-bottom:18px; box-shadow: 0 4px 20px rgba(253,186,59,0.5); align-self:flex-start; animation: slideUp 0.7s cubic-bezier(0.4,0,0.2,1) both; }
  .slide-title { font-size:5rem; font-weight:900; line-height:1.05; margin-bottom:16px; color:#fff; text-shadow: 4px 4px 30px rgba(0,0,0,0.7); animation: slideUp 0.8s cubic-bezier(0.4,0,0.2,1) 0.1s both; }
  .slide-title .gold { color:#FDBA3B; position:relative; display:inline-block; }
  .slide-title .gold::after { content:''; position:absolute; bottom:6px; left:-4px; right:-4px; height:10px; background: linear-gradient(90deg, #FB5D3B, #e94560); z-index:-1; border-radius:4px; opacity:0.7; }
  @keyframes slideUp { from { opacity:0; transform:translateY(40px); } to { opacity:1; transform:translateY(0); } }

  .slide-subtitle { font-size:1.8rem; color:rgba(255,255,255,0.85); margin-bottom:40px; font-weight:500; letter-spacing:1px; animation: slideUp 0.9s cubic-bezier(0.4,0,0.2,1) 0.2s both; }

  .info-grid { display:grid; grid-template-columns: repeat(2, 1fr); gap:20px; margin-top:20px; max-width:1200px; }
  .info-card { background: rgba(255,255,255,0.08); backdrop-filter: blur(20px); border:1.5px solid rgba(255,255,255,0.18); border-radius:16px; padding:22px 28px; animation: cardSlide 0.8s cubic-bezier(0.4,0,0.2,1) both; position:relative; overflow:hidden; }
  .info-card::before { content:''; position:absolute; top:0; left:0; width:4px; height:100%; background: linear-gradient(180deg,#FDBA3B,#FB5D3B); }
  .info-card:nth-child(1) { animation-delay: 0.4s; }
  .info-card:nth-child(2) { animation-delay: 0.5s; }
  .info-card:nth-child(3) { animation-delay: 0.6s; }
  .info-card:nth-child(4) { animation-delay: 0.7s; }
  @keyframes cardSlide { from { opacity:0; transform:translateX(-30px); } to { opacity:1; transform:translateX(0); } }
  .info-card .label { font-size:0.85rem; color:#FDBA3B; font-weight:700; letter-spacing:2px; margin-bottom:8px; text-transform:uppercase; }
  .info-card .value { font-size:1.5rem; color:#fff; font-weight:600; line-height:1.3; }

  /* Scrolling Website URL */
  .scrolling-url { position:fixed; bottom:30px; left:0; right:0; height:50px; background: linear-gradient(90deg, transparent, rgba(0,0,0,0.7) 20%, rgba(0,0,0,0.7) 80%, transparent); overflow:hidden; z-index:500; display:flex; align-items:center; }
  .scrolling-track { display:flex; gap:80px; white-space:nowrap; animation: scrollLeft 20s linear infinite; }
  @keyframes scrollLeft { from { transform:translateX(0); } to { transform:translateX(-50%); } }
  .scroll-item { color:#FDBA3B; font-size:1.2rem; font-weight:700; letter-spacing:2px; display:flex; align-items:center; gap:12px; flex-shrink:0; }
  .scroll-item .dot { width:8px; height:8px; background:#FDBA3B; border-radius:50%; box-shadow: 0 0 10px #FDBA3B; }

  /* Progress Bar */
  .progress-container { position:fixed; bottom:0; left:0; right:0; height:6px; background: rgba(0,0,0,0.5); z-index:9999; }
  .progress-bar { height:100%; background: linear-gradient(90deg,#FDBA3B,#FB5D3B); width:0%; box-shadow: 0 0 15px rgba(253,186,59,0.8); }

  /* Intro Screen */
  .intro-screen { position:fixed; inset:0; background: linear-gradient(135deg, #0a1929, #0f3460, #1a5276); z-index:9998; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:40px; transition: opacity 1.2s ease, visibility 1.2s; }
  .intro-screen.hidden { opacity:0; visibility:hidden; pointer-events:none; }
  .intro-logo { width:120px; height:120px; background: linear-gradient(135deg,#FDBA3B,#FB5D3B); border-radius:30px; display:flex; align-items:center; justify-content:center; font-family: Georgia, serif; font-weight:900; font-size:70px; color:#0a1929; box-shadow: 0 20px 60px rgba(253,186,59,0.5); margin-bottom:30px; animation: introPop 1s cubic-bezier(0.4,0,0.2,1); }
  @keyframes introPop { 0% { transform:scale(0.5) rotate(-20deg); opacity:0; } 60% { transform:scale(1.1) rotate(5deg); } 100% { transform:scale(1) rotate(0deg); opacity:1; } }
  .intro-brand { color:#FDBA3B; font-size:1rem; font-weight:700; letter-spacing:8px; margin-bottom:12px; animation: fadeInUp 1s ease 0.3s both; }
  .intro-title { color:#fff; font-size:4.5rem; font-weight:900; font-family: Georgia, serif; margin-bottom:20px; line-height:1.1; animation: fadeInUp 1s ease 0.5s both; }
  .intro-subtitle { color:rgba(255,255,255,0.85); font-size:1.8rem; font-weight:500; margin-bottom:40px; animation: fadeInUp 1s ease 0.7s both; }
  .intro-features { display:flex; gap:15px; flex-wrap:wrap; justify-content:center; animation: fadeInUp 1s ease 0.9s both; }
  .intro-feature { background: rgba(255,255,255,0.1); color:#fff; padding:12px 24px; border-radius:30px; font-size:1.1rem; font-weight:600; border:1.5px solid rgba(255,255,255,0.2); backdrop-filter: blur(10px); }
  .intro-feature.gold { background: linear-gradient(135deg,#FDBA3B,#FB5D3B); color:#0a1929; border-color:#FDBA3B; }
  @keyframes fadeInUp { from { opacity:0; transform:translateY(30px); } to { opacity:1; transform:translateY(0); } }

  /* Start Button */
  #startBtn { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); z-index:99999; background: linear-gradient(135deg,#FDBA3B,#FB5D3B); color:#0a1929; border:5px solid #fff; padding:28px 65px; border-radius:80px; font-size:2rem; font-weight:900; cursor:pointer; box-shadow: 0 30px 80px rgba(0,0,0,0.7); letter-spacing:3px; font-family:inherit; transition: all 0.3s; }
  #startBtn:hover { transform: translate(-50%,-50%) scale(1.08); }
</style>
</head>
<body>
<div class="bg-layer"></div>
<div class="ripples"></div>
<div class="particles" id="particles"></div>

<div class="top-bar">
  <div class="top-logo">
    <div class="top-logo-icon">R</div>
    <div class="top-logo-text">
      <div class="small">THE</div>
      <div class="big">Ravishankar Insights</div>
    </div>
  </div>
  <div class="slide-counter" id="counter">1 / 14</div>
</div>

<div class="slides-container" id="slidesContainer"></div>

<div class="scrolling-url">
  <div class="scrolling-track" id="scrollTrack"></div>
</div>

<div class="progress-container">
  <div class="progress-bar" id="progress"></div>
</div>

<div class="intro-screen hidden" id="introScreen">
  <div class="intro-logo">R</div>
  <div class="intro-brand">THE RAVISHANKAR INSIGHTS</div>

  <div class="intro-subtitle">Rivers of India — A Complete Journey</div>

    <div class="intro-feature">प्रायद्वीपीय नदियाँ</div>

</div>

<script>
(function() {
  var SLIDES = [
    { num:'01', title:'भारत की <span class="gold">नदियाँ</span>', subtitle:'Rivers of India — एक विस्तृत यात्रा', info:[{label:'क्षेत्रफल',value:'32.87 लाख वर्ग किमी'},{label:'नदी तंत्र',value:'2 मुख्य श्रेणियाँ'},{label:'हिमालयी',value:'सिंधु, गंगा, ब्रह्मपुत्र'},{label:'प्रायद्वीपीय',value:'गोदावरी, कृष्णा, कावेरी'}], narration:'नमस्ते दोस्तों! आज हम बात करेंगे भारत की नदियों के बारे में। भारत का क्षेत्रफल बत्तीस पॉइंट आठ सात लाख वर्ग किलोमीटर है। यहाँ नदियों की दो मुख्य श्रेणियाँ हैं — हिमालयी और प्रायद्वीपीय।' },
    { num:'02', title:'हिमालयी <span class="gold">नदियाँ</span>', subtitle:'बर्फ पिघलने से निकलने वाली नदियाँ', info:[{label:'सिंधु',value:'2880 किमी — अरब सागर'},{label:'गंगा',value:'2525 किमी — बंगाल की खाड़ी'},{label:'ब्रह्मपुत्र',value:'2900 किमी — कुल लंबाई'},{label:'यमुना',value:'1376 किमी — गंगा की सहायक'}], narration:'हिमालयी नदियाँ बर्फ पिघलने से निकलती हैं और साल भर बहती रहती हैं। इनमें जल की मात्रा बहुत अधिक होती है। मुख्य हिमालयी नदियाँ हैं सिंधु, गंगा, यमुना, ब्रह्मपुत्र, घाघरा और गंडक।' },
    { num:'03', title:'सिंधु <span class="gold">नदी</span>', subtitle:'Indus River — भारत की पश्चिमी सीमा', info:[{label:'उद्गम',value:'बोखर चू (तिब्बत)'},{label:'लंबाई',value:'2880 किमी'},{label:'गिरती है',value:'अरब सागर'},{label:'सहायक',value:'झेलम, चिनाब, रावी'}], narration:'सिंधु नदी का उद्गम तिब्बत में बोखर चू ग्लेशियर से होता है। इसकी लंबाई दो हज़ार आठ सौ अस्सी किलोमीटर है। ये अरब सागर में कराची के पास गिरती है।' },
    { num:'04', title:'गंगा <span class="gold">नदी</span>', subtitle:'भारत की सबसे लंबी और पवित्र नदी', info:[{label:'उद्गम',value:'गंगोत्री (उत्तराखंड)'},{label:'लंबाई',value:'2525 किमी'},{label:'गिरती है',value:'बंगाल की खाड़ी'},{label:'डेल्टा',value:'सुंदरवन'}], narration:'गंगा नदी का उद्गम उत्तराखंड में गंगोत्री से होता है। इसकी लंबाई दो हज़ार पाँच सौ पच्चीस किलोमीटर है और ये भारत की सबसे लंबी नदी है। ये बंगाल की खाड़ी में सुंदरवन डेल्टा बनाकर गिरती है।' },
    { num:'05', title:'यमुना <span class="gold">नदी</span>', subtitle:'गंगा की सबसे लंबी सहायक नदी', info:[{label:'उद्गम',value:'यमुनोत्री'},{label:'लंबाई',value:'1376 किमी'},{label:'शहर',value:'दिल्ली, आगरा, मथुरा'},{label:'मिलती है',value:'प्रयागराज में'}], narration:'यमुना नदी यमुनोत्री ग्लेशियर से निकलती है। इसकी लंबाई एक हज़ार तीन सौ छिहत्तर किलोमीटर है। दिल्ली, आगरा और मथुरा इसके किनारे बसे हैं। ये प्रयागराज में गंगा से मिलती है।' },
    { num:'06', title:'ब्रह्मपुत्र <span class="gold">नदी</span>', subtitle:'तिब्बत से बांग्लादेश तक', info:[{label:'उद्गम',value:'मानसरोवर के पास'},{label:'कुल लंबाई',value:'2900 किमी'},{label:'तिब्बत में',value:'त्सांगपो'},{label:'असम में',value:'ब्रह्मपुत्र'}], narration:'ब्रह्मपुत्र नदी का उद्गम मानसरोवर के पास तिब्बत में होता है। इसकी कुल लंबाई दो हज़ार नौ सौ किलोमीटर है। तिब्बत में इसे त्सांगपो कहते हैं और बांग्लादेश में जमुना।' },
    { num:'07', title:'प्रायद्वीपीय <span class="gold">नदियाँ</span>', subtitle:'वर्षा पर निर्भर मौसमी नदियाँ', info:[{label:'गोदावरी',value:'1465 किमी — सबसे लंबी'},{label:'कृष्णा',value:'1400 किमी'},{label:'कावेरी',value:'805 किमी'},{label:'महानदी',value:'858 किमी'}], narration:'अब बात करते हैं प्रायद्वीपीय नदियों की। ये नदियाँ वर्षा पर निर्भर हैं और मौसमी होती हैं। मुख्य प्रायद्वीपीय नदियाँ हैं गोदावरी, कृष्णा, कावेरी, नर्मदा, ताप्ती और महानदी।' },
    { num:'08', title:'गोदावरी <span class="gold">नदी</span>', subtitle:'दक्षिण गंगा — दक्षिण भारत की सबसे लंबी', info:[{label:'उद्गम',value:'त्रयंबकेश्वर (नासिक)'},{label:'लंबाई',value:'1465 किमी'},{label:'उपनाम',value:'दक्षिण गंगा'},{label:'गिरती है',value:'बंगाल की खाड़ी'}], narration:'गोदावरी नदी का उद्गम नासिक के त्रयंबकेश्वर से होता है। इसकी लंबाई एक हज़ार चार सौ पैंसठ किलोमीटर है और ये दक्षिण भारत की सबसे लंबी नदी है। इसे दक्षिण गंगा भी कहा जाता है।' },
    { num:'09', title:'कृष्णा <span class="gold">नदी</span>', subtitle:'महाराष्ट्र से आंध्र तक', info:[{label:'उद्गम',value:'महाबलेश्वर'},{label:'लंबाई',value:'1400 किमी'},{label:'सहायक',value:'भीमा, तुंगभद्रा'},{label:'शहर',value:'विजयवाड़ा'}], narration:'कृष्णा नदी महाराष्ट्र के महाबलेश्वर से निकलती है। इसकी लंबाई एक हज़ार चार सौ किलोमीटर है। मुख्य सहायक नदियाँ हैं भीमा, तुंगभद्रा, कोयना और घाटप्रभा।' },
    { num:'10', title:'कावेरी <span class="gold">नदी</span>', subtitle:'दक्षिण की गंगा — तमिलनाडु की जीवन रेखा', info:[{label:'उद्गम',value:'तालकावेरी (कर्नाटक)'},{label:'लंबाई',value:'805 किमी'},{label:'उपनाम',value:'दक्षिण की गंगा'},{label:'विशेष',value:'अन्न भंडार'}], narration:'कावेरी नदी कर्नाटक के तालकावेरी से निकलती है। इसकी लंबाई आठ सौ पाँच किलोमीटर है। इसे दक्षिण की गंगा कहा जाता है। ये तमिलनाडु का अन्न भंडार है।' },
    { num:'11', title:'नर्मदा और <span class="gold">ताप्ती</span>', subtitle:'पश्चिम की ओर बहने वाली नदियाँ', info:[{label:'नर्मदा',value:'अमरकंटक — 1312 किमी'},{label:'ताप्ती',value:'बैतूल — 724 किमी'},{label:'गिरती हैं',value:'खंभात की खाड़ी'},{label:'विशेष',value:'द्रोणी में बहती हैं'}], narration:'पश्चिम की ओर बहने वाली दो प्रमुख नदियाँ हैं नर्मदा और ताप्ती। नर्मदा का उद्गम अमरकंटक से होता है और लंबाई एक हज़ार तीन सौ बारह किलोमीटर है। ताप्ती मध्य प्रदेश के बैतूल से निकलती है।' },
    { num:'12', title:'पूर्व बनाम <span class="gold">पश्चिम</span>', subtitle:'कौन-सी नदियाँ डेल्टा बनाती हैं?', info:[{label:'पूर्व की ओर',value:'डेल्टा बनाती हैं'},{label:'पश्चिम की ओर',value:'डेल्टा नहीं बनातीं'},{label:'पूर्व वाली',value:'बंगाल की खाड़ी'},{label:'पश्चिम वाली',value:'अरब सागर'}], narration:'पूर्व की ओर बहने वाली नदियाँ डेल्टा बनाती हैं और बंगाल की खाड़ी में गिरती हैं। जबकि पश्चिम की ओर बहने वाली नदियाँ डेल्टा नहीं बनातीं और अरब सागर में गिरती हैं।' },
    { num:'13', title:'नदियों का <span class="gold">महत्व</span>', subtitle:'कृषि, पेयजल, ऊर्जा और संस्कृति', info:[{label:'कृषि',value:'सिंचाई का स्रोत'},{label:'पेयजल',value:'करोड़ों लोगों के लिए'},{label:'ऊर्जा',value:'जल विद्युत उत्पादन'},{label:'संस्कृति',value:'धार्मिक आस्था'}], narration:'नदियों का महत्व बहुत अधिक है। ये कृषि के लिए सिंचाई का मुख्य स्रोत हैं, करोड़ों लोगों को पेयजल देती हैं, जल विद्युत उत्पादन करती हैं और धार्मिक आस्था का केंद्र हैं।' },
    { num:'14', title:'धन्यवाद! <span class="gold">Subscribe करें</span>', subtitle:'और भी सीखने के लिए जुड़े रहें', info:[{label:'Website',value:'ravishankarkamal59-eng.github.io'},{label:'Free Notes',value:'1000+ PDF उपलब्ध'},{label:'AI Assistant',value:'24×7 उपलब्ध'},{label:'Subscribe',value:'🔔 बेल दबाएँ'}], narration:'तो दोस्तों उम्मीद है आपको ये वीडियो पसंद आया होगा। और भी सरकारी परीक्षाओं की तैयारी के लिए हमारी वेबसाइट visit करें — ravishankarkamal59-eng.github.io। चैनल को subscribe करें और वीडियो को like और share करें। धन्यवाद!' }
  ];

  var SLIDE_DURATION = 14000;
  var INTRO_DURATION = 8000;
  var TOTAL_DURATION = SLIDES.length * SLIDE_DURATION;

  var particlesContainer = document.getElementById('particles');
  for (var p = 0; p < 40; p++) {
    var particle = document.createElement('div');
    particle.className = 'particle';
    particle.style.left = Math.random() * 100 + '%';
    particle.style.animationDuration = (8 + Math.random() * 10) + 's';
    particle.style.animationDelay = (Math.random() * 10) + 's';
    particle.style.width = (2 + Math.random() * 4) + 'px';
    particle.style.height = particle.style.width;
    particlesContainer.appendChild(particle);
  }

  var container = document.getElementById('slidesContainer');
  SLIDES.forEach(function(slide, idx) {
    var slideEl = document.createElement('div');
    slideEl.className = 'slide' + (idx === 0 ? ' active' : '');
    var infoHtml = '';
    slide.info.forEach(function(item) {
      infoHtml += '<div class="info-card"><div class="label">' + item.label + '</div><div class="value">' + item.value + '</div></div>';
    });
    slideEl.innerHTML = '<div class="slide-number">SLIDE ' + slide.num + '</div><div class="slide-title">' + slide.title + '</div><div class="slide-subtitle">' + slide.subtitle + '</div><div class="info-grid">' + infoHtml + '</div>';
    container.appendChild(slideEl);
  });

  var slides = document.querySelectorAll('.slide');
  var progress = document.getElementById('progress');
  var counter = document.getElementById('counter');
  var introScreen = document.getElementById('introScreen');

  var scrollTrack = document.getElementById('scrollTrack');
  var urlText = '🌐 ravishankarkamal59-eng.github.io';
  var trackHtml = '';
  for (var i = 0; i < 6; i++) {
    trackHtml += '<div class="scroll-item"><span class="dot"></span>' + urlText + '</div>';
  }
  scrollTrack.innerHTML = trackHtml + trackHtml;

  var voices = [];
  var hindiVoice = null;
  var voiceQueue = [];
  var isSpeaking = false;

  function loadVoices() {
    voices = window.speechSynthesis.getVoices();
    for (var i = 0; i < voices.length; i++) {
      if (voices[i].lang.indexOf('hi') === 0) { hindiVoice = voices[i]; break; }
    }
  }

  if ('speechSynthesis' in window) {
    window.speechSynthesis.onvoiceschanged = loadVoices;
    loadVoices();
    setTimeout(loadVoices, 500);
    setTimeout(loadVoices, 1500);
  }

  function speak(text, onEnd) {
    if (!('speechSynthesis' in window)) { if (onEnd) onEnd(); processQueue(); return; }
    var utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'hi-IN';
    utter.rate = 1.0;
    utter.pitch = 1;
    utter.volume = 1;
    if (hindiVoice) utter.voice = hindiVoice;
    utter.onend = function() { if (onEnd) onEnd(); processQueue(); };
    utter.onerror = function() { if (onEnd) onEnd(); processQueue(); };
    window.speechSynthesis.speak(utter);
  }

  function queueSpeech(text, onEnd) {
    voiceQueue.push({ text: text, onEnd: onEnd });
    if (!isSpeaking) processQueue();
  }

  function processQueue() {
    if (voiceQueue.length === 0) { isSpeaking = false; return; }
    isSpeaking = true;
    var item = voiceQueue.shift();
    speak(item.text, item.onEnd);
  }

  var currentSlide = 0;
  function goToSlide(idx) {
    slides.forEach(function(s) { s.classList.remove('active'); });
    slides[idx].classList.add('active');
    counter.textContent = (idx + 1) + ' / ' + SLIDES.length;
  }

  var startBtn = document.createElement('button');
  startBtn.id = 'startBtn';
  startBtn.innerHTML = '▶️ START VIDEO';
  document.body.appendChild(startBtn);

  startBtn.addEventListener('click', function() {
    startBtn.remove();
    loadVoices();
    introScreen.classList.remove('hidden');

    var introText = 'नमस्ते दोस्तों! स्वागत है The Ravishankar Insights पर। यहाँ आपको सभी सरकारी परीक्षाओं की तैयारी बिल्कुल मुफ़्त में मिलेगी — Notes, PDF, AI Assistant और भी बहुत कुछ। आज हम सीखेंगे भारत की नदियों के बारे में। चलिए शुरू करते हैं!';

    queueSpeech(introText, function() {
      setTimeout(function() { introScreen.classList.add('hidden'); }, 1500);
    });

    SLIDES.forEach(function(slide) { queueSpeech(slide.narration, null); });

    setTimeout(function() {
      var startTime = Date.now();
      function updateProgress() {
        var elapsed = Date.now() - startTime;
        var percent = Math.min(100, (elapsed / TOTAL_DURATION) * 100);
        progress.style.width = percent + '%';
        var newSlide = Math.floor(elapsed / SLIDE_DURATION);
        if (newSlide >= SLIDES.length) newSlide = SLIDES.length - 1;
        if (newSlide !== currentSlide) { currentSlide = newSlide; goToSlide(currentSlide); }
        if (elapsed < TOTAL_DURATION) { requestAnimationFrame(updateProgress); }
      }
      requestAnimationFrame(updateProgress);
    }, INTRO_DURATION);
  });
})();
</script>
