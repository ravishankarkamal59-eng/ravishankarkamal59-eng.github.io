<script>
/* BA / MA CARD UPLOAD PREFILL */
(function () {
  const params = new URLSearchParams(window.location.search);
  const urlSection = (params.get("section") || "").toLowerCase();
  const urlCard = params.get("card") || "";

  if (!urlSection) return;

  window.addEventListener("DOMContentLoaded", function () {
    const sectionEl =
      document.getElementById("uploadSection") ||
      document.getElementById("section") ||
      document.querySelector('[name="section"]');

    const cardEl =
      document.getElementById("uploadCard") ||
      document.getElementById("card") ||
      document.querySelector('[name="card"]');

    if (sectionEl) {
      sectionEl.value = urlSection;
      sectionEl.dispatchEvent(new Event("change", { bubbles: true }));
    }

    if (cardEl && urlCard) {
      cardEl.value = urlCard;
    }
  });
})();



function updateBaMaFields() {

  const section =
    document.getElementById("uploadSection")?.value || "";

  const baMaBox =
    document.getElementById("baMaFields");

  const upscBox =
    document.getElementById("upscFields");

  if (baMaBox) {
    baMaBox.style.display =
      (section === "ba" || section === "ma")
        ? "block"
        : "none";
  }

  if (upscBox) {
    upscBox.style.display =
      section === "upsc"
        ? "block"
        : "none";
  }

  if (section !== "ba" && section !== "ma") {

    const subject =
      document.getElementById("uploadSubject");

    const paper =
      document.getElementById("uploadPaper");

    if (subject) subject.value = "";
    if (paper) paper.value = "";
  }

  if (section !== "upsc") {

    const upscPaper =
      document.getElementById("upscPaper");

    if (upscPaper) upscPaper.value = "";
  }
}

document.addEventListener("DOMContentLoaded", function () {
  const section =
    document.getElementById("uploadSection");

  if (section) {
    section.addEventListener(
      "change",
      updateBaMaFields
    );

    updateBaMaFields();
  }
});

const API =
"https://ravishankar-insights-backend-1.onrender.com";


// ADMIN SECTION AUTO SELECT
(function () {
  const params = new URLSearchParams(window.location.search);
  const section = params.get("section");

  if (section) {
    const select = document.getElementById("uploadSection");

    if (select) {
      const option = Array.from(select.options)
        .find(o => o.value === section);

      if (option) {
        select.value = section;
      }
    }
  }
})();

async function uploadMaterial(){

  const file =
    document.getElementById("materialFile").files[0];

  const section =
    document.getElementById("uploadSection").value;

  const card =
    section === "upsc"
      ? "UPSC"
      : (document.getElementById("uploadCard")?.value || "");

  const materialType =
    document.getElementById("materialType").value;
  
  const subject =
    document.getElementById("uploadSubject")?.value || "";

  const paper =
    section === "upsc"
      ? (document.getElementById("upscPaper")?.value || "")
      : (document.getElementById("uploadPaper")?.value || "");

  const message =
    document.getElementById("uploadMessage");

  const result =
    document.getElementById("uploadResult");

  const button =
    document.getElementById("uploadButton");


  message.textContent = "";
  result.innerHTML = "";


  if (
    (section === "ba" || section === "ma") &&
    !subject
  ) {
    message.style.color = "red";
    message.textContent =
      "❌ पहले Subject चुनें।";
    return;
  }

  if (
    section === "upsc" &&
    !paper
  ) {
    message.style.color = "red";
    message.textContent =
      "❌ पहले UPSC Paper चुनें।";
    return;
  }

  if (
    (section === "ba" || section === "ma") &&
    !paper
  ) {
    message.style.color = "red";
    message.textContent =
      "❌ पहले Semester / Paper चुनें।";
    return;
  }

  if(!file){

    message.style.color = "red";

    message.textContent =
      "❌ पहले PDF या Video चुनें।";

    return;
  }


  const allowed = [
    "application/pdf",
    "video/mp4",
    "video/webm",
    "video/quicktime"
  ];


  if(!allowed.includes(file.type)){

    message.style.color = "red";

    message.textContent =
      "❌ सिर्फ PDF या Video file allowed है।";

    return;
  }


  const token =
    localStorage.getItem("adminToken");


  if(!token){

    message.style.color = "red";

    message.textContent =
      "❌ Admin login required है।";

    return;
  }


  const formData =
    new FormData();

  formData.append(
    "section",
    section
  );

  formData.append(
    "card",
    card
  );

  formData.append(
    "materialType",
    materialType
  );

  formData.append(
    "subject",
    subject
  );

  formData.append(
    "paper",
    paper
  );

  formData.append(
    "file",
    file
  );


  button.disabled = true;

  message.style.color = "#1677ff";

  message.textContent =
    "⏳ Upload हो रहा है...";


  try{

    const response =
      await fetch(
        API + "/api/admin/upload",
        {
          method:"POST",

          headers:{
            "Authorization":
              "Bearer " + token
          },

          body:formData
        }
      );


    const data =
      await response.json();


    if(response.status === 401){

      localStorage.removeItem(
        "adminToken"
      );

      message.style.color = "red";

      message.textContent =
        "❌ Admin session expired. फिर से login करें।";

      button.disabled = false;

      return;
    }


    if(!response.ok || !data.success){

      message.style.color = "red";

      message.textContent =
        "❌ " +
        (data.message ||
        "Upload failed.");

      button.disabled = false;

      return;
    }


    message.style.color = "green";

    message.textContent =
      "✅ File successfully upload हो गई।";


    if(data.material && data.material.url){

      const fileURL =
        API + data.material.url;


      result.innerHTML =
        "<strong>📚 Section:</strong> " +
        section.toUpperCase() +

        "<br><strong>📄 File:</strong> " +
        data.material.name +

        "<br>" +

        "<a href=\"" +
        fileURL +
        "\" target=\"_blank\">" +
        "🔗 Open Uploaded File" +
        "</a>";
    }


    document.getElementById(
      "materialFile"
    ).value = "";


  }catch(error){

    console.error(error);

    message.style.color = "red";

    message.textContent =
      "❌ Server से connection नहीं हो पाया।";

  }


  button.disabled = false;

}

</script>
