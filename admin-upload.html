<script>

const API =
"https://ravishankar-insights-backend-1.onrender.com";


// ADMIN SECTION AUTO SELECT
(function () {
  const params = new URLSearchParams(window.location.search);
  const section = params.get("section");

  if (section) {
    const select = document.getElementById("uploadSection");

    if (select) {
      const option = Array.from(select.options)
        .find(o => o.value === section);

      if (option) {
        select.value = section;
      }
    }
  }
})();

async function uploadMaterial(){

  const file =
    document.getElementById("materialFile").files[0];

  const section =
    document.getElementById("uploadSection").value;

  const card =
    document.getElementById("uploadCard").value;

  const materialType =
    document.getElementById("materialType").value;

  const paper =
    document.getElementById("uploadPaper").value;

  const subject =
    document.getElementById("uploadSubject").value;

  const message =
    document.getElementById("uploadMessage");

  const result =
    document.getElementById("uploadResult");

  const button =
    document.getElementById("uploadButton");


  message.textContent = "";
  result.innerHTML = "";


  if(!file){

    message.style.color = "red";

    message.textContent =
      "❌ पहले PDF या Video चुनें।";

    return;
  }


  const allowed = [
    "application/pdf",
    "video/mp4",
    "video/webm",
    "video/quicktime"
  ];


  if(!allowed.includes(file.type)){

    message.style.color = "red";

    message.textContent =
      "❌ सिर्फ PDF या Video file allowed है।";

    return;
  }


  const token =
    localStorage.getItem("adminToken");


  if(!token){

    message.style.color = "red";

    message.textContent =
      "❌ Admin login required है।";

    return;
  }


  const formData =
    new FormData();

  formData.append(
    "file",
    file
  );

  formData.append(
    "section",
    section
  );

  formData.append(
    "card",
    card
  );

  formData.append(
    "materialType",
    materialType
  );

  formData.append(
    "paper",
    paper
  );

  formData.append(
    "subject",
    subject
  );


  button.disabled = true;

  message.style.color = "#1677ff";

  message.textContent =
    "⏳ Upload हो रहा है...";


  try{

    const response =
      await fetch(
        API + "/api/admin/upload",
        {
          method:"POST",

          headers:{
            "Authorization":
              "Bearer " + token
          },

          body:formData
        }
      );


    const data =
      await response.json();


    if(response.status === 401){

      localStorage.removeItem(
        "adminToken"
      );

      message.style.color = "red";

      message.textContent =
        "❌ Admin session expired. फिर से login करें।";

      button.disabled = false;

      return;
    }


    if(!response.ok || !data.success){

      message.style.color = "red";

      message.textContent =
        "❌ " +
        (data.message ||
        "Upload failed.");

      button.disabled = false;

      return;
    }


    message.style.color = "green";

    message.textContent =
      "✅ File successfully upload हो गई।";


    if(data.file && data.file.url){

      const fileURL =
        API + data.file.url;


      result.innerHTML =
        "<strong>📚 Section:</strong> " +
        section.toUpperCase() +

        "<br><strong>📄 File:</strong> " +
        data.file.name +

        "<br>" +

        "<a href=\"" +
        fileURL +
        "\" target=\"_blank\">" +
        "🔗 Open Uploaded File" +
        "</a>";
    }


    document.getElementById(
      "materialFile"
    ).value = "";


  }catch(error){

    console.error(error);

    message.style.color = "red";

    message.textContent =
      "❌ Server से connection नहीं हो पाया।";

  }


  button.disabled = false;

}

</script>
