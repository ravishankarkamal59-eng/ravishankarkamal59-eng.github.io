<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>बुकिंग करें - भारत घूमो</title>
  <meta name="description" content="अपना टूर पैकेज अभी बुक करें।">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <a href="#main" class="skip-link">मुख्य सामग्री पर जाएँ</a>
  <header>
    <nav aria-label="मुख्य नेविगेशन">
      <div class="logo">🌏 भारत घूमो</div>
      <ul class="nav-links">
        <li><a href="index.html">होम</a></li>
        <li><a href="packages.html">पैकेज</a></li>
      </ul>
    </nav>
  </header>
  <main id="main">
    <section class="content">
      <h1>बुकिंग फॉर्म</h1>
      <p id="pkgInfo"></p>
      <form id="bookForm">
        <label for="bname">पूरा नाम *</label>
        <input type="text" id="bname" required>
        <label for="bphone">मोबाइल नंबर *</label>
        <input type="tel" id="bphone" pattern="[0-9]{10}" required placeholder="10 अंक">
        <label for="bemail">ईमेल</label>
        <input type="email" id="bemail">
        <label for="bdate">यात्रा की तारीख *</label>
        <input type="date" id="bdate" required>
        <label for="bpeople">कितने लोग? *</label>
        <input type="number" id="bpeople" min="1" value="2" required>
        <label for="bmsg">विशेष जानकारी</label>
        <textarea id="bmsg" rows="3"></textarea>
        <button type="submit" class="btn">WhatsApp पर भेजें</button>
      </form>
      <p id="bookMsg"></p>
    </section>
  </main>
  <footer><p>© 2026 भारत घूमो</p></footer>
  <script>
    const params = new URLSearchParams(location.search);
    const pkg = params.get('pkg') || '';
    if (pkg) document.getElementById('pkgInfo').textContent = 'चुना गया पैकेज: ' + pkg.toUpperCase();
    document.getElementById('bookForm').onsubmit = (e) => {
      e.preventDefault();
      const name = document.getElementById('bname').value;
      const phone = document.getElementById('bphone').value;
      const email = document.getElementById('bemail').value;
      const date = document.getElementById('bdate').value;
      const people = document.getElementById('bpeople').value;
      const msg = document.getElementById('bmsg').value;
      const text = `नमस्ते! मुझे बुकिंग करनी है:%0Aपैकेज: ${pkg}%0Aनाम: ${name}%0Aफोन: ${phone}%0Aईमेल: ${email}%0Aतारीख: ${date}%0Aलोग: ${people}%0Aसंदेश: ${msg}`;
      window.open('https://wa.me/919999999999?text=' + text, '_blank');
      document.getElementById('bookMsg').textContent = '✅ WhatsApp खुल रहा है...';
    };
  </script>
</body>
</html>
