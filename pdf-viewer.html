<script>
function $(id){ return document.getElementById(id); }

function getDriveEmbed(url){
  // Convert Google Drive link to embed format
  var m = url.match(/\/file\/d\/([^\/]+)/);
  if (m) return 'https://drive.google.com/file/d/' + m[1] + '/preview';
  m = url.match(/[?&]id=([^&]+)/);
  if (m) return 'https://drive.google.com/file/d/' + m[1] + '/preview';
  return url;
}

function openPdf(url){
  if (!url || !url.trim()) { alert('PDF URL डालें'); return; }
  url = url.trim();
  var embed = getDriveEmbed(url);
  $('pdfFrame').src = embed;
  $('dlBtn').href = url;
  $('viewerArea').style.display = 'block';
  $('viewerArea').scrollIntoView({ behavior: 'smooth' });
}

$('openBtn').onclick = function(){ openPdf($('pdfUrl').value); };

function closeViewer(){
  $('pdfFrame').src = '';
  $('viewerArea').style.display = 'none';
}

// URL parameter से auto-open
var params = new URLSearchParams(location.search);
if (params.get('url')) {
  var u = decodeURIComponent(params.get('url'));
  $('pdfUrl').value = u;
  openPdf(u);
}
</script>
