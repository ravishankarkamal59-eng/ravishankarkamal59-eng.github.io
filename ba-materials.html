<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>BA Materials | The Ravishankar Insights</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#172033;
}

header{
  background:linear-gradient(135deg,#172554,#2563eb);
  color:white;
  text-align:center;
  padding:25px 15px;
}

header h1{
  margin:0;
  font-size:26px;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:20px 15px 50px;
}

.back{
  display:inline-block;
  margin-bottom:20px;
  color:#1d4ed8;
  text-decoration:none;
  font-weight:bold;
}

.subject-card{
  background:white;
  border-radius:16px;
  padding:20px;
  margin-bottom:20px;
  box-shadow:0 5px 18px rgba(0,0,0,.08);
}

.subject-card h2{
  margin-top:0;
  color:#172554;
}

.paper{
  border-top:1px solid #e5e7eb;
  padding:15px 0;
}

.paper h3{
  margin:0 0 12px;
  color:#334155;
}

.buttons{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.material-btn{
  border:0;
  border-radius:8px;
  padding:9px 13px;
  cursor:pointer;
  font-weight:bold;
  background:#eef2ff;
  color:#1d4ed8;
}

.material-btn:hover{
  background:#dbeafe;
}

.material-list{
  margin-top:12px;
}

.material-file{
  background:#f8fafc;
  border:1px solid #e2e8f0;
  border-radius:10px;
  padding:12px;
  margin-top:8px;
}

.material-file a{
  display:inline-block;
  margin-top:8px;
  background:#2563eb;
  color:white;
  padding:8px 12px;
  border-radius:7px;
  text-decoration:none;
}

.empty{
  color:#64748b;
  font-size:14px;
}

.login{
  background:#fff7ed;
  padding:12px;
  border-radius:10px;
  color:#9a3412;
}

@media(max-width:600px){
  .buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
  }

  .material-btn{
    width:100%;
  }
}

.material-sections{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin-top:12px;
}

.material-section{
  background:#f8fafc;
  border:1px solid #e2e8f0;
  border-radius:12px;
  padding:12px;
  text-align:center;
}

.material-section h4{
  margin:0 0 10px;
  color:#172554;
  font-size:15px;
}

.material-section .material-btn{
  width:100%;
}

@media(max-width:700px){
  .material-sections{
    grid-template-columns:1fr 1fr;
  }
}

@media(max-width:420px){
  .material-sections{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<header>
<h1>🎓 BA Study Materials</h1>
<p>PYQ • Notes • Syllabus • PDF</p>
</header>

<main class="container">

<a class="back" href="materials.html">
← Materials पर वापस जाएँ
</a>

<div id="subjects">
⏳ BA Materials load हो रहे हैं...
</div>

</main>

<script>

const API =
"https://ravishankar-insights-backend-1.onrender.com";

const SUBJECTS = [
  "Political Science",
  "Philosophy",
  "History",
  "Geography",
  "Economics",
  "Sociology",
  "Hindi",
  "English",
  "Education"
];

const PAPERS = [
  "Semester 1",
  "Semester 2",
  "Semester 3",
  "Semester 4",
  "Semester 5",
  "Semester 6",
  "Paper 1",
  "Paper 2",
  "Paper 3",
  "Paper 4",
  "Paper 5",
  "Paper 6"
];

async function loadMaterial(subject,paper,type,list){

  list.innerHTML =
    "⏳ Material load हो रहा है...";

  try{

    const response =
      await fetch(
        API +
        "/api/card-materials?card=BA" +
        "&type=" +
        encodeURIComponent(type) +
        "&subject=" +
        encodeURIComponent(subject) +
        "&paper=" +
        encodeURIComponent(paper),
        {
          credentials:"include"
        }
      );

    if(response.status === 401){

      list.innerHTML = `
        <div class="login">
          🔐 Material देखने के लिए Student Login जरूरी है।
          <br><br>
          <a href="login.html">🎓 Student Login</a>
        </div>
      `;

      return;
    }

    const data = await response.json();

    if(!response.ok || !data.success){
      throw new Error(data.message || "API error");
    }

    const materials = data.materials || [];

    if(!materials.length){

      list.innerHTML =
        `<div class="empty">
          📭 ${type.toUpperCase()} अभी उपलब्ध नहीं है।
        </div>`;

      return;
    }

    list.innerHTML =
      materials.map(material => {

        const url =
          API + material.url;

        return `
          <div class="material-file">

            📄 ${material.name || "Study Material"}

            <br>

            <a href="${url}" target="_blank">
              📖 Open
            </a>

            <a href="${url}" download>
              ⬇️ Download
            </a>

          </div>
        `;

      }).join("");

  }catch(error){

    console.error(error);

    list.innerHTML =
      `<div class="empty">
        ❌ Material load नहीं हो पाया।
      </div>`;
  }
}


function createSubject(subject){

  const card =
    document.createElement("div");

  card.className="subject-card";

  card.innerHTML =
    `<h2>📚 ${subject}</h2>`;

  PAPERS.forEach(paper => {

    const paperBox =
      document.createElement("div");

    paperBox.className="paper";

    paperBox.innerHTML = `
      <h3>📄 ${paper}</h3>

      <div class="material-sections">

        <div class="material-section">
          <h4>📄 PYQ</h4>
          <button class="material-btn" data-type="pyq">
            PYQ देखें
          </button>
        </div>

        <div class="material-section">
          <h4>📝 Notes</h4>
          <button class="material-btn" data-type="notes">
            Notes देखें
          </button>
        </div>

        <div class="material-section">
          <h4>📕 PDF</h4>
          <button class="material-btn" data-type="pdf">
            PDF देखें
          </button>
        </div>

        <div class="material-section">
          <h4>📚 Syllabus</h4>
          <button class="material-btn" data-type="syllabus">
            Syllabus देखें
          </button>
        </div>

      </div>

      <div class="material-list"></div>
    `;

    const list =
      paperBox.querySelector(".material-list");

    paperBox
      .querySelectorAll("[data-type]")
      .forEach(button => {

        button.addEventListener("click",() => {

          loadMaterial(
            subject,
            paper,
            button.dataset.type,
            list
          );

        });

      });

    card.appendChild(paperBox);

  });

  return card;
}


document.addEventListener(
  "DOMContentLoaded",
  () => {

    const box =
      document.getElementById("subjects");

    box.innerHTML="";

    SUBJECTS.forEach(subject => {

      box.appendChild(
        createSubject(subject)
      );

    });

  }
);

</script>

</body>
</html>
