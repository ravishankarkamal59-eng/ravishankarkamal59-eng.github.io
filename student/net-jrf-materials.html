<script>

function showFile(input, outputId){

  const output =
    document.getElementById(outputId);

  if(input.files && input.files.length > 0){

    output.textContent =
      "Selected: " + input.files[0].name;

  }else{

    output.textContent =
      "No file selected";

  }

}

</script>


<script>
const API = "https://ravishankar-insights-backend-1.onrender.com";

async function loadNETJRFMaterials() {
  try {
    const response = await fetch(API + "/api/materials/net-jrf");
    const data = await response.json();

    if (!data.success) return;

    const pdfButtons = document.querySelectorAll(".pdf");

    if (!data.files || data.files.length === 0) {
      pdfButtons.forEach(btn => {
        btn.textContent = "📄 PDF अभी उपलब्ध नहीं";
        btn.disabled = true;
      });
      return;
    }

    const pdfFiles = data.files.filter(file =>
      file.name.toLowerCase().endsWith(".pdf")
    );

    pdfButtons.forEach(btn => {
      if (pdfFiles.length > 0) {
        btn.onclick = () => {
          window.open(API + pdfFiles[0].url, "_blank");
        };
      } else {
        btn.textContent = "📄 PDF अभी उपलब्ध नहीं";
        btn.disabled = true;
      }
    });

  } catch (error) {
    console.error("net-jrf materials error:", error);
  }
}

document.addEventListener(
  "DOMContentLoaded",
  loadNETJRFMaterials
);
</script>
