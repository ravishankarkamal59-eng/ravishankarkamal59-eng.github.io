<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BA PDFs | The Ravishankar Insights</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f4f7fb;
  color:#172033;
}

header{
  background:linear-gradient(135deg,#07111f,#123b5d);
  color:white;
  padding:25px 18px;
}

header h1{
  max-width:1100px;
  margin:auto;
}

.container{
  max-width:1100px;
  margin:25px auto;
  padding:0 18px;
}

.back{
  display:inline-block;
  margin-bottom:20px;
  color:#1677ff;
  text-decoration:none;
  font-weight:bold;
}

.grid{
  display:grid;
  grid-template-columns:
  repeat(auto-fit,minmax(250px,1fr));
  gap:20px;
}

.card{
  background:white;
  padding:25px;
  border-radius:18px;
  box-shadow:0 7px 22px rgba(0,0,0,.08);
}

.card h2{
  color:#123b5d;
  margin-bottom:10px;
}

.card p{
  color:#777;
  margin-bottom:18px;
}

input[type="file"]{
  width:100%;
  margin-bottom:12px;
}

button,
.open{
  display:inline-block;
  border:0;
  padding:10px 16px;
  border-radius:9px;
  background:#1677ff;
  color:white;
  text-decoration:none;
  font-weight:bold;
  cursor:pointer;
}

.pdf-box{
  margin-top:18px;
  padding-top:15px;
  border-top:1px solid #ddd;
}

.pdf-box a{
  color:#1677ff;
  font-weight:bold;
  text-decoration:none;
}
</style>
</head>

<body>

<header>
<h1>📚 BA PDF Materials</h1>
</header>

<div class="container">

<a class="back" href="materials.html">
← Materials पर वापस जाएँ
</a>

<div class="grid">

<!-- BA 1st Year -->
<div class="card">

<h2>📘 BA 1st Year</h2>

<p>BA 1st Year की PDF यहाँ रखें।</p>

<input
type="file"
id="pdf1"
accept="application/pdf"
>

<button onclick="savePDF('pdf1','pdf1Link')">
PDF Save
</button>

<div class="pdf-box">
<a
id="pdf1Link"
target="_blank"
style="display:none"
>
📄 Open PDF
</a>
</div>

</div>


<!-- BA 2nd Year -->
<div class="card">

<h2>📗 BA 2nd Year</h2>

<p>BA 2nd Year की PDF यहाँ रखें।</p>

<input
type="file"
id="pdf2"
accept="application/pdf"
>

<button onclick="savePDF('pdf2','pdf2Link')">
PDF Save
</button>

<div class="pdf-box">
<a
id="pdf2Link"
target="_blank"
style="display:none"
>
📄 Open PDF
</a>
</div>

</div>


<!-- BA 3rd Year -->
<div class="card">

<h2>📕 BA 3rd Year</h2>

<p>BA 3rd Year की PDF यहाँ रखें।</p>

<input
type="file"
id="pdf3"
accept="application/pdf"
>

<button onclick="savePDF('pdf3','pdf3Link')">
PDF Save
</button>

<div class="pdf-box">
<a
id="pdf3Link"
target="_blank"
style="display:none"
>
📄 Open PDF
</a>
</div>

</div>

</div>
</div>

<div class="container" id="uploadedMaterials" style="margin-top:30px;">
<h2>📚 Uploaded BA Materials</h2>
<div id="materialsList">⏳ Materials load हो रहे हैं...</div>
</div>
<script>

function savePDF(inputId, linkId){

  const file =
    document.getElementById(inputId).files[0];

  if(!file){

    alert("पहले PDF चुनें।");
    return;
  }

  if(file.type !== "application/pdf"){

    alert("सिर्फ PDF file चुनें।");
    return;
  }

  const url =
    URL.createObjectURL(file);

  const link =
    document.getElementById(linkId);

  link.href = url;
  link.style.display = "inline-block";

  alert("PDF तैयार है। अब Open PDF दबाएँ।");
}

const BACKEND="https://ravishankar-insights-backend-1.onrender.com";

async function loadUploadedMaterials(){
  const box=document.getElementById("materialsList");
  try{
    const response=await fetch(BACKEND+"/api/materials/ba");
    const data=await response.json();

    if(!data.success || !data.files.length){
      box.innerHTML="<p>अभी कोई uploaded material नहीं है।</p>";
      return;
    }

    box.innerHTML=data.files.map(file=>`
      <div style="background:white;padding:16px;margin:12px 0;border-radius:12px;box-shadow:0 4px 15px rgba(0,0,0,.08);">
        <strong>📄 ${file.name}</strong>
        <br>
        <a href="${BACKEND}${file.url}" target="_blank" style="display:inline-block;margin-top:10px;padding:10px 16px;background:#1677ff;color:white;text-decoration:none;border-radius:8px;">
        📖 Open PDF
        </a>
        <a href="${BACKEND}${file.url}" download style="display:inline-block;margin-top:10px;margin-left:8px;padding:10px 16px;background:#168f45;color:white;text-decoration:none;border-radius:8px;">
        ⬇️ Download
        </a>
      </div>
    `).join("");
  }catch(error){
    console.error(error);
    box.innerHTML="<p style="color:red;">Materials load नहीं हो पाए।</p>";
  }
}

loadUploadedMaterials();
</script>


</body>
</html>
