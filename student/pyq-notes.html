<script>
const API = "https://ravishankar-insights-backend-1.onrender.com";

const PYQ_SECTIONS = {
  "BA": "ba",
  "MA": "ma",
  "UPPCS": "uppcs",
  "NET JRF": "net-jrf",
  "UPSC": "upsc",
  "RAILWAY": "railway",
  "SSC": "ssc",
  "BANKING": "banking"
};

async function loadPYQNotes() {

  const sections = document.querySelectorAll("h2");

  for (const sectionHeading of sections) {

    const sectionName = sectionHeading.textContent
      .replace(/[^\w\s]/g, "")
      .trim()
      .toUpperCase();

    const section = PYQ_SECTIONS[sectionName];

    if (!section) continue;

    const box = sectionHeading.parentElement;

    if (!box) continue;

    const response = await fetch(
      API + "/api/materials/" + section
    );

    const data = await response.json();

    if (!data.success) continue;

    const pdfFiles = (data.files || []).filter(file =>
      file.name.toLowerCase().endsWith(".pdf")
    );

    const headings = box.querySelectorAll("h3");

    headings.forEach(heading => {

      const title = heading.textContent.toLowerCase();

      const card = heading.parentElement;

      if (!card) return;

      const pdfButton = card.querySelector(".pdf");

      if (!pdfButton) return;

      let selected = null;

      if (title.includes("pyq")) {

        selected = pdfFiles.find(file =>
          file.name.toLowerCase().includes("pyq")
        );

      } else if (title.includes("notes")) {

        selected = pdfFiles.find(file =>
          file.name.toLowerCase().includes("note")
        );

      }

      // अगर नाम में PYQ/Notes नहीं है तो पहला PDF
      if (!selected && pdfFiles.length > 0) {
        selected = pdfFiles[0];
      }

      if (selected) {

        pdfButton.disabled = false;

        pdfButton.textContent = "📄 Open PDF";

        pdfButton.onclick = () => {
          window.open(
            API + selected.url,
            "_blank"
          );
        };

      } else {

        pdfButton.textContent =
          "📄 PDF अभी उपलब्ध नहीं";

        pdfButton.disabled = true;
      }

    });
  }
}

document.addEventListener(
  "DOMContentLoaded",
  loadPYQNotes
);
