<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Articles | The Ravishankar Insights</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f4f7fb;
  color:#172033;
}

header{
  background:linear-gradient(135deg,#07111f,#123b5d);
  color:white;
  padding:28px 18px;
}

header h1{
  max-width:1100px;
  margin:auto;
}

.container{
  max-width:1000px;
  margin:30px auto;
  padding:0 18px;
}

#articles{
  display:grid;
  gap:20px;
}

.article-card{
  background:white;
  padding:24px;
  border-radius:18px;
  box-shadow:0 7px 22px rgba(0,0,0,.08);
}

.article-card h2{
  color:#123b5d;
  margin-bottom:10px;
}

.category{
  display:inline-block;
  background:#e67e22;
  color:white;
  padding:5px 10px;
  border-radius:7px;
  font-size:13px;
  margin-bottom:15px;
}

.article-text{
  line-height:1.7;
  white-space:pre-wrap;
}

.date{
  color:#777;
  font-size:13px;
  margin-top:15px;
}

.message{
  text-align:center;
  padding:30px;
  font-weight:bold;
}
</style>
</head>

<body>

<header>
<h1>📰 Articles</h1>
</header>

<div class="container">

<div id="articles">
  <div class="message">Articles load हो रहे हैं...</div>
</div>

</div>

<script>

async function loadArticles(){

  const articlesBox =
    document.getElementById("articles");

  try{

    const response = await fetch(
      "https://ravishankar-insights-backend-1.onrender.com/api/articles"
    );

    const data = await response.json();

    if(!response.ok){

      articlesBox.innerHTML =
        '<div class="message">Articles load नहीं हो पाए।</div>';

      return;
    }

    if(!data.articles || data.articles.length === 0){

      articlesBox.innerHTML =
        '<div class="message">अभी कोई Article उपलब्ध नहीं है।</div>';

      return;
    }

    articlesBox.innerHTML = "";

    const requestedId =
      new URLSearchParams(window.location.search).get("id");

    let articlesToShow = data.articles
      .slice()
      .reverse();

    if(requestedId){
      articlesToShow = data.articles.filter(
        article => String(article.id) === String(requestedId)
      );
    }

    if(requestedId && articlesToShow.length === 0){
      articlesBox.innerHTML =
        '<div class="message">❌ यह Article उपलब्ध नहीं है।</div>';
      return;
    }

    articlesToShow.forEach(article => {

        const card =
          document.createElement("div");

        card.className = "article-card";

        card.innerHTML = `
          <span class="category">
            ${escapeHTML(article.category || "General")}
          </span>

          <h2>
            ${escapeHTML(article.title)}
          </h2>

          <div class="article-text">
            ${escapeHTML(article.article)}
          </div>

          <div class="date">
            ${article.createdAt
              ? new Date(article.createdAt).toLocaleString("hi-IN")
              : ""}
          </div>
        `;

        articlesBox.appendChild(card);

      });

  }catch(error){

    console.log(error);

    articlesBox.innerHTML =
      '<div class="message">❌ अभी सेवा उपलब्ध नहीं है। कृपया थोड़ी देर बाद फिर प्रयास करें।</div>';
  }

}


function escapeHTML(text){

  const div =
    document.createElement("div");

  div.textContent = text;

  return div.innerHTML;
}


loadArticles();

</script>

</body>
</html>
