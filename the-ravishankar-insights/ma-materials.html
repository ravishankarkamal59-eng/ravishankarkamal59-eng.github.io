<style id="ma-hide-admin">
.upload,
.admin-only {
  display: none !important;
}
</style>


<script>
const API = "https://ravishankar-insights-backend-1.onrender.com";

async function loadMAMaterials() {
  try {
    const response = await fetch(API + "/api/materials/ma");
    const data = await response.json();

    const pdfButtons = document.querySelectorAll(".open");

    if (!data.success || !data.files || data.files.length === 0) {
      pdfButtons.forEach(btn => {
        btn.textContent = "📄 PDF अभी उपलब्ध नहीं";
        btn.disabled = true;
      });
      return;
    }

    const pdfFiles = data.files.filter(file =>
      file.name.toLowerCase().endsWith(".pdf")
    );

    pdfButtons.forEach((btn, index) => {

      if (!pdfFiles[index]) {
        btn.textContent = "📄 PDF अभी उपलब्ध नहीं";
        btn.disabled = true;
        return;
      }

      btn.textContent = "📄 Open PDF";

      btn.onclick = async () => {
        try {
          const studentSession =
            localStorage.getItem("studentSession");

          if (!studentSession) {
            throw new Error("Student login required");
          }

          const pdfResponse = await fetch(
            API + pdfFiles[index].url,
            {
              headers: {
                "Authorization": "Bearer " + studentSession
              }
            }
          );

          if (!pdfResponse.ok) {
            throw new Error("PDF access denied");
          }

          const blob = await pdfResponse.blob();
          const pdfUrl = URL.createObjectURL(blob);

          window.open(pdfUrl, "_blank");

          setTimeout(() => {
            URL.revokeObjectURL(pdfUrl);
          }, 60000);

        } catch (error) {
          console.error("MA PDF open error:", error);
          alert("PDF खोलने के लिए Student Login जरूरी है।");
        }
      };
    });

  } catch (error) {
    console.error("MA materials error:", error);
  }
}

document.addEventListener("DOMContentLoaded", loadMAMaterials);
</script>
