var state = { questions: [], answers: [], current: 0, timeLeft: 0, timerInterval: null };

function $(id) { return document.getElementById(id); }
function shuffle(arr) { return arr.slice().sort(function() { return Math.random() - 0.5; }); }

$('startBtn').onclick = function() {
  var cat = $('selCat').value;
  var mins = parseInt($('selTime').value);
  var numQ = parseInt($('selQ').value);
  var level = parseInt($('selLevel').value);
  var all = QUESTIONS[cat] || QUESTIONS.gk;
  
  // Level के अनुसार random questions
  var shuffled = shuffle(all);
  var startIdx = (level - 1) * 10;
  var levelQuestions = shuffled.slice(startIdx, startIdx + 10);
  if (levelQuestions.length < 10) levelQuestions = shuffled.slice(0, 20);
  
  state.questions = shuffle(levelQuestions).slice(0, Math.min(numQ, levelQuestions.length));
  state.answers = new Array(state.questions.length).fill(null);
  state.current = 0;
  state.timeLeft = mins * 60;
  
  $('setupScreen').style.display = 'none';
  $('quizScreen').style.display = 'block';
  $('qTotal').textContent = state.questions.length;
  
  state.timerInterval = setInterval(tick, 1000);
  renderQuestion();
};

function tick() {
  state.timeLeft--;
  var m = Math.floor(state.timeLeft / 60);
  var s = state.timeLeft % 60;
  $('timer').textContent = (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
  if (state.timeLeft <= 30) $('timer').style.color = '#e74c3c';
  if (state.timeLeft <= 0) { clearInterval(state.timerInterval); finishQuiz(); }
}

function renderQuestion() {
  var q = state.questions[state.current];
  $('qText').textContent = (state.current + 1) + '. ' + q.q;
  $('qCounter').textContent = state.current + 1;
  $('progBar').style.width = ((state.current + 1) / state.questions.length * 100) + '%';
  
  var html = '';
  for (var i = 0; i < q.o.length; i++) {
    var selected = state.answers[state.current] === i;
    html += '<div class="opt" data-i="' + i + '" style="padding:0.9rem 1rem;margin:0.5rem 0;background:' + (selected ? '#0f3460' : '#f8fafc') + ';color:' + (selected ? '#fff' : '#333') + ';border-radius:10px;cursor:pointer;border:2px solid ' + (selected ? '#0f3460' : 'transparent') + ';font-size:0.95rem">' + String.fromCharCode(65+i) + '. ' + q.o[i] + '</div>';
  }
  $('options').innerHTML = html;
  
  document.querySelectorAll('.opt').forEach(function(el) {
    el.onclick = function() {
      state.answers[state.current] = parseInt(this.dataset.i);
      renderQuestion();
    };
  });
  
  $('prevBtn').disabled = state.current === 0;
  $('nextBtn').style.display = state.current < state.questions.length - 1 ? 'block' : 'none';
  $('submitBtn').style.display = state.current === state.questions.length - 1 ? 'block' : 'none';
}

$('prevBtn').onclick = function() { if (state.current > 0) { state.current--; renderQuestion(); } };
$('nextBtn').onclick = function() { if (state.current < state.questions.length - 1) { state.current++; renderQuestion(); } };
$('skipBtn').onclick = function() { if (state.current < state.questions.length - 1) { state.current++; renderQuestion(); } };
$('submitBtn').onclick = function() { if (confirm('Quiz submit करें?')) { clearInterval(state.timerInterval); finishQuiz(); } };

function finishQuiz() {
  clearInterval(state.timerInterval);
  $('quizScreen').style.display = 'none';
  $('resultScreen').style.display = 'block';
  
  var correct = 0, wrong = 0, skip = 0;
  for (var i = 0; i < state.questions.length; i++) {
    if (state.answers[i] === null) skip++;
    else if (state.answers[i] === state.questions[i].a) correct++;
    else wrong++;
  }
  
  var percent = Math.round((correct / state.questions.length) * 100);
  $('scorePercent').textContent = percent + '%';
  $('correctCount').textContent = correct;
  $('wrongCount').textContent = wrong;
  $('skipCount').textContent = skip;
  
  var msg = percent >= 80 ? '🏆 शानदार! बहुत अच्छा!' : percent >= 60 ? '👍 अच्छा प्रदर्शन!' : percent >= 40 ? '📚 Practice जरूरी है।' : '💪 Practice से सुधर जाएगा।';
  $('scoreMsg').textContent = msg;
  
  // Save score
  try {
    var scores = JSON.parse(localStorage.getItem('quizScores') || '[]');
    scores.push({ percent: percent, date: new Date().toISOString() });
    scores.sort(function(a, b) { return b.percent - a.percent; });
    localStorage.setItem('quizScores', JSON.stringify(scores.slice(0, 5)));
  } catch(e) {}
}

$('reviewBtn').onclick = function() {
  var sec = $('reviewSection');
  var html = '<h2 style="color:#0f3460;margin-bottom:1rem">📋 Answer Review</h2>';
  for (var i = 0; i < state.questions.length; i++) {
    var q = state.questions[i];
    var ua = state.answers[i];
    var badge = ua === null ? '⏭️ छोड़ा' : (ua === q.a ? '✅ सही' : '❌ गलत');
    var color = ua === null ? '#f39c12' : (ua === q.a ? '#27ae60' : '#e74c3c');
    html += '<div style="background:#fff;padding:1rem;border-radius:12px;margin-bottom:0.8rem;box-shadow:0 2px 8px rgba(0,0,0,0.06)">';
    html += '<div style="display:flex;justify-content:space-between;margin-bottom:0.5rem"><strong style="color:#0f3460">Q' + (i+1) + '</strong><span style="color:' + color + ';font-weight:600;font-size:0.85rem">' + badge + '</span></div>';
    html += '<p style="margin-bottom:0.5rem;font-size:0.95rem">' + q.q + '</p>';
    for (var j = 0; j < q.o.length; j++) {
      var oColor = j === q.a ? '#d4edda' : (j === ua ? '#f8d7da' : '#f8fafc');
      var oBorder = j === q.a ? '#27ae60' : (j === ua ? '#e74c3c' : 'transparent');
      html += '<div style="padding:0.5rem 0.8rem;margin:0.3rem 0;background:' + oColor + ';border:2px solid ' + oBorder + ';border-radius:8px;font-size:0.88rem">' + String.fromCharCode(65+j) + '. ' + q.o[j] + '</div>';
    }
    html += '</div>';
  }
  sec.innerHTML = html;
  sec.style.display = 'block';
  sec.scrollIntoView({ behavior: 'smooth' });
};
