<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Dashboard | The Ravishankar Insights</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f4f7fb;
  color:#172033;
}

header{
  background:linear-gradient(135deg,#07111f,#123b5d);
  color:white;
  padding:28px 18px;
}

.header-inner{
  max-width:1100px;
  margin:auto;
}

.header-inner h1{
  margin-bottom:7px;
}

.header-inner p{
  opacity:.85;
}

.container{
  max-width:1100px;
  margin:30px auto;
  padding:0 18px;
}

.admin-grid{
  display:grid;
  grid-template-columns:
  repeat(auto-fit,minmax(240px,1fr));
  gap:20px;
}

.admin-card{
  background:white;
  padding:25px;
  border-radius:18px;
  box-shadow:0 7px 22px rgba(0,0,0,.08);
  transition:.2s;
}

.admin-card:hover{
  transform:translateY(-4px);
}

.admin-card h2{
  margin-bottom:10px;
  color:#123b5d;
}

.admin-card p{
  color:#666;
  line-height:1.5;
  margin-bottom:18px;
}

.admin-btn{
  display:block;
  text-align:center;
  text-decoration:none;
  background:#1677ff;
  color:white;
  padding:12px;
  border-radius:9px;
  font-weight:bold;
}

.logout{
  background:#d63031;
}

footer{
  text-align:center;
  color:#777;
  padding:35px 15px;
}
</style>
</head>


<script>
(function(){

  const token = localStorage.getItem("adminToken");

  if (!token) {
    window.location.replace("admin-login.html");
    return;
  }

})();
</script>

<body>

<header>
  <div class="header-inner">
    <h1>⚙️ Admin Dashboard</h1>
    <p>The Ravishankar Insights</p>
    <button class="logout" onclick="adminLogout()">🚪 Logout</button>
  </div>
</header>


<div class="container">

  <div class="admin-card" style="margin-bottom:25px;">
    <h2>➕ Add New Card</h2>
    <p>Main Website पर नया section/card जोड़ें।</p>

    <form id="cardForm">

      <input
        id="cardTitle"
        type="text"
        placeholder="Card Title"
        required
        style="width:100%;padding:12px;margin:6px 0;border:1px solid #ddd;border-radius:8px;"
      >

      <input
        id="cardIcon"
        type="text"
        placeholder="Icon जैसे 📚"
        value="📚"
        style="width:100%;padding:12px;margin:6px 0;border:1px solid #ddd;border-radius:8px;"
      >

      <input
        id="cardDescription"
        type="text"
        placeholder="Card Description"
        style="width:100%;padding:12px;margin:6px 0;border:1px solid #ddd;border-radius:8px;"
      >

      <input
        id="cardSection"
        type="text"
        placeholder="Section जैसे banking-exams"
        required
        style="width:100%;padding:12px;margin:6px 0;border:1px solid #ddd;border-radius:8px;"
      >

      <input
        id="cardPage"
        type="text"
        placeholder="Page जैसे banking-exams-materials.html"
        required
        style="width:100%;padding:12px;margin:6px 0;border:1px solid #ddd;border-radius:8px;"
      >

      <button
        type="submit"
        class="admin-btn"
        style="border:0;width:100%;cursor:pointer;margin-top:10px;"
      >
        ➕ Add Card
      </button>

    </form>

    <p id="cardMessage" style="margin-top:12px;"></p>
  </div>

  <div class="admin-card" style="margin-bottom:25px;">
    <h2>📋 Added Cards</h2>
    <div id="cardsList">Loading...</div>
  </div>



  <div class="admin-grid">

    <div class="admin-card">
      <h2>🎓 BA</h2>
      <p>BA section को manage करें।</p>
      <a href="ba-materials.html" class="admin-btn">
        Manage BA
      </a>
    </div>

    <div class="admin-card">
      <h2>🎓 MA</h2>
      <p>MA section को manage करें।</p>
      <a href="ma-materials.html" class="admin-btn">
        Manage MA
      </a>
    </div>

  </div>
<footer>
  © 2026 The Ravishankar Insights
</footer>


<script>
(function(){

  const API =
    "https://ravishankar-insights-backend-1.onrender.com";

  const form = document.getElementById("cardForm");
  const message = document.getElementById("cardMessage");
  const cardsList = document.getElementById("cardsList");

  async function loadCards(){

    try {

      const response =
        await fetch(API + "/api/cards");

      const data =
        await response.json();

      if (!data.success) {
        cardsList.innerHTML = "Cards load नहीं हो पाए।";
        return;
      }

      if (!data.cards.length) {
        cardsList.innerHTML = "<p>अभी कोई नया Card नहीं है।</p>";
        return;
      }

      cardsList.innerHTML =
        data.cards.map(card => `
          <div style="
            background:#f7f9fc;
            padding:15px;
            margin:10px 0;
            border-radius:12px;
            border:1px solid #ddd;
          ">
            <h3>${card.icon} ${card.title}</h3>
            <p>${card.description || ""}</p>
            <small>
              Section: ${card.section}<br>
              Page: ${card.page}
            </small>

            <button
              onclick="deleteCard('${card.id}')"
              style="
                margin-top:10px;
                background:#d63031;
                color:white;
                border:0;
                padding:9px 14px;
                border-radius:7px;
                cursor:pointer;
              "
            >
              🗑️ Delete
            </button>
          </div>
        `).join("");

    } catch(error) {

      console.error(error);
      cardsList.innerHTML =
        "Cards load करने में समस्या हुई।";

    }

  }

  form.addEventListener("submit", async function(e){

    e.preventDefault();

    const token =
      localStorage.getItem("adminToken");

    if (!token) {
      window.location.href = "admin-login.html";
      return;
    }

    const payload = {

      title:
        document.getElementById("cardTitle").value.trim(),

      icon:
        document.getElementById("cardIcon").value.trim(),

      description:
        document.getElementById("cardDescription").value.trim(),

      section:
        document.getElementById("cardSection").value.trim(),

      page:
        document.getElementById("cardPage").value.trim()

    };

    message.textContent = "Card add हो रहा है...";

    try {

      const response =
        await fetch(
          API + "/api/admin/cards",
          {
            method:"POST",

            headers:{
              "Content-Type":"application/json",
              "Authorization":"Bearer " + token
            },

            body:JSON.stringify(payload)
          }
        );

      const data =
        await response.json();

      if (!response.ok || !data.success) {

        message.textContent =
          data.message || "Card add नहीं हुआ।";

        return;
      }

      message.textContent =
        "✅ Card successfully added.";

      form.reset();

      document.getElementById("cardIcon").value =
        "📚";

      await loadCards();

    } catch(error) {

      console.error(error);

      message.textContent =
        "Server से connection नहीं हो पाया।";

    }

  });

  window.deleteCard = async function(id){

    const token =
      localStorage.getItem("adminToken");

    if (!token) {
      window.location.href = "admin-login.html";
      return;
    }

    if (!confirm("क्या यह Card delete करना है?")) {
      return;
    }

    try {

      const response =
        await fetch(
          API + "/api/admin/cards/" +
          encodeURIComponent(id),
          {
            method:"DELETE",

            headers:{
              "Authorization":"Bearer " + token
            }
          }
        );

      const data =
        await response.json();

      if (!response.ok || !data.success) {
        alert(data.message || "Card delete नहीं हुआ।");
        return;
      }

      await loadCards();

    } catch(error) {

      console.error(error);
      alert("Server से connection नहीं हो पाया।");

    }

  };

  loadCards();

})();
</script>

</body>
</html>
