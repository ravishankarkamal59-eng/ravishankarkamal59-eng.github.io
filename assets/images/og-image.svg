<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f3460"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e94560"/>
      <stop offset="100%" stop-color="#ff6b6b"/>
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#ffffff" opacity="0.05"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="1200" height="10" fill="url(#accent)"/>

  <!-- Decorative circles -->
  <circle cx="1050" cy="120" r="180" fill="#e94560" opacity="0.08"/>
  <circle cx="1100" cy="550" r="120" fill="#0f3460" opacity="0.3"/>
  <circle cx="150" cy="550" r="150" fill="#e94560" opacity="0.05"/>

  <!-- Logo circle -->
  <circle cx="140" cy="160" r="70" fill="#e94560"/>
  <text x="140" y="185" font-family="Georgia,serif" font-size="70" font-weight="bold" fill="#fff" text-anchor="middle">R</text>

  <!-- Brand name -->
  <text x="240" y="140" font-family="Arial,sans-serif" font-size="28" font-weight="600" fill="#e94560" letter-spacing="2">THE RAVISHANKAR</text>
  <text x="240" y="185" font-family="Georgia,serif" font-size="52" font-weight="bold" fill="#ffffff" letter-spacing="1">INSIGHTS</text>

  <!-- Main heading -->
  <text x="80" y="330" font-family="Arial,sans-serif" font-size="62" font-weight="bold" fill="#ffffff">सरकारी परीक्षा की</text>
  <text x="80" y="405" font-family="Arial,sans-serif" font-size="62" font-weight="bold" fill="#ffffff">तैयारी का <tspan fill="#e94560">भरोसेमंद</tspan></text>
  <text x="80" y="480" font-family="Arial,sans-serif" font-size="62" font-weight="bold" fill="#ffffff">प्लेटफॉर्म</text>

  <!-- Divider line -->
  <rect x="80" y="510" width="100" height="4" fill="#e94560"/>

  <!-- Sub heading -->
  <text x="80" y="560" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#c5c6c7">Notes | PDF | PYQ | Syllabus — Hindi &amp; English</text>

  <!-- Bottom right badge -->
  <rect x="920" y="540" width="230" height="50" rx="25" fill="url(#accent)"/>
  <text x="1035" y="572" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle">ravishankarkamal59-eng.github.io</text>

  <!-- Exams tags -->
  <g transform="translate(80, 590)">
    <rect x="0" y="0" width="90" height="26" rx="13" fill="#ffffff" opacity="0.1"/>
    <text x="45" y="18" font-family="Arial,sans-serif" font-size="13" fill="#fff" text-anchor="middle">UPSC</text>
    <rect x="100" y="0" width="90" height="26" rx="13" fill="#ffffff" opacity="0.1"/>
    <text x="145" y="18" font-family="Arial,sans-serif" font-size="13" fill="#fff" text-anchor="middle">UPPCS</text>
    <rect x="200" y="0" width="90" height="26" rx="13" fill="#ffffff" opacity="0.1"/>
    <text x="245" y="18" font-family="Arial,sans-serif" font-size="13" fill="#fff" text-anchor="middle">BPSC</text>
    <rect x="300" y="0" width="90" height="26" rx="13" fill="#ffffff" opacity="0.1"/>
    <text x="345" y="18" font-family="Arial,sans-serif" font-size="13" fill="#fff" text-anchor="middle">SSC</text>
    <rect x="400" y="0" width="90" height="26" rx="13" fill="#ffffff" opacity="0.1"/>
    <text x="445" y="18" font-family="Arial,sans-serif" font-size="13" fill="#fff" text-anchor="middle">UGC NET</text>
    <rect x="500" y="0" width="90" height="26" rx="13" fill="#ffffff" opacity="0.1"/>
    <text x="545" y="18" font-family="Arial,sans-serif" font-size="13" fill="#fff" text-anchor="middle">BA/MA</text>
  </g>
</svg>
