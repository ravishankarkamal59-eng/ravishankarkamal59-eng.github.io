    <text x="257" y="19" font-family="Segoe UI, Arial" font-size="12" font-weight="600" fill="#fff" text-anchor="middle">🤖 AI सहायक</text>
    
    <rect x="315" y="0" width="105" height="28" rx="14" fill="#f39c12" opacity="0.9"/>
