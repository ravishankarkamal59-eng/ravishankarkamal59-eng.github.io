  <text x="130" y="130" font-family="Georgia, serif" font-size="46" font-weight="700" fill="url(#goldGrad)">Ravishankar</text>
  <text x="130" y="165" font-family="Georgia, serif" font-size="26" font-weight="600" fill="#ffffff" letter-spacing="6">INSIGHTS</text>
  
