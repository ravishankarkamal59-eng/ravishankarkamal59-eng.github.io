<svg width="900" height="320" viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&amp;display=swap');
      .name { font-family: 'Space Grotesk', sans-serif; font-weight: 700; }
      .sub  { font-family: 'Space Grotesk', sans-serif; font-weight: 500; letter-spacing: 8px; }
      .mono { font-family: 'Space Grotesk', sans-serif; font-weight: 700; }
    </style>

    <linearGradient id="spark" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FDBA3B"/>
      <stop offset="100%" stop-color="#FB5D3B"/>
    </linearGradient>

    <linearGradient id="badgeStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDBA3B" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FB5D3B" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <!-- backdrop -->
  <rect width="900" height="320" rx="28" fill="#0B1220"/>

  <!-- icon badge -->
  <g transform="translate(60,80)">
    <rect x="0" y="0" width="160" height="160" rx="34" fill="#141C31" stroke="url(#badgeStroke)" stroke-width="2"/>

    <!-- monogram R, leg replaced by an ascending insight line -->
    <text x="34" y="122" class="mono" font-size="104" fill="url(#spark)">R</text>

    <!-- ascending spark line completing the R's leg, reads as a trend/insight signal -->
    <path d="M 96 96 L 122 122 L 138 78" stroke="url(#spark)" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- radiant dot: the "Ravi" (sun) mark, and the spark of insight -->
    <circle cx="138" cy="78" r="7" fill="url(#spark)"/>

    <!-- three short rays, quiet radiance around the peak -->
    <line x1="146" y1="58" x2="152" y2="48" stroke="url(#spark)" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="158" y1="70" x2="170" y2="66" stroke="url(#spark)" stroke-width="3.5" stroke-linecap="round" opacity="0.7"/>
    <line x1="130" y1="52" x2="126" y2="40" stroke="url(#spark)" stroke-width="3.5" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- wordmark -->
  <g transform="translate(256,0)">
    <text x="0" y="168" class="name" font-size="58" fill="#F5F7FA">Ravishankar</text>
    <rect x="4" y="196" width="420" height="1.5" fill="#FFFFFF" opacity="0.15"/>
    <text x="4" y="232" class="sub" font-size="24" fill="url(#spark)">INSIGHTS</text>
  </g>
</svg>
