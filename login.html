<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>लॉगिन / साइनअप - The Ravishankar Insights</title>
  <meta name="description" content="मुफ़्त अकाउंट बनाएँ और सभी नोट्स, क्विज़, PDF का फायदा उठाएँ।">
  <link rel="canonical" href="https://ravishankarkamal59-eng.github.io/login.html">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header>
    <div class="top-bar">मुफ़्त अकाउंट बनाएँ</div>
    <nav>
      <div class="logo">📚 The <span>Ravishankar</span> Insights</div>
      <ul class="nav-links"><li><a href="index.html">होम</a></li></ul>
    </nav>
  </header>
  <main>
    <div class="content" style="max-width:480px; margin:2rem auto">
      <h1 id="authTitle">लॉगिन करें</h1>
      <p id="authMsg" style="min-height:1.2rem; font-size:0.9rem; margin:0.5rem 0"></p>
      <form id="authForm">
        <label for="email">ईमेल</label>
        <input type="email" id="email" required autocomplete="email">
        <label for="password">पासवर्ड</label>
        <input type="password" id="password" required autocomplete="current-password">
        <label for="name" id="nameLabel" style="display:none">नाम</label>
        <input type="text" id="name" style="display:none" autocomplete="name">
        <button type="submit" class="btn" id="submitBtn">लॉगिन</button>
      </form>
      <p style="text-align:center; margin-top:0.8rem">
        <span id="switchText">नया यूज़र? </span>
        <a href="#" id="switchBtn" style="color:var(--accent); font-weight:600">साइनअप करें</a>
      </p>
      <p style="text-align:center"><a href="#" id="resetBtn" style="color:var(--accent); font-size:0.9rem">पासवर्ड भूल गए?</a></p>
      <button id="googleBtn" class="btn" style="background:#db4437; width:100%">🔵 Google से लॉगिन</button>
      <p style="font-size:0.85rem; color:#888; text-align:center; margin-top:1rem">साइनअप करके आप हमारी <a href="terms.html">शर्तों</a> और <a href="privacy.html">प्राइवेसी</a> से सहमत होते हैं।</p>
    </div>
  </main>
  <footer><div class="footer-bottom">© 2026 The Ravishankar Insights</div></footer>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signInWithRedirect, getRedirectResult, GoogleAuthProvider, sendPasswordResetEmail, updateProfile } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    const firebaseConfig = {
      apiKey: "अपनी_असली_की",
      authDomain: "अपना_authDomain",
      projectId: "ravishankar-insights",
      storageBucket: "अपना_storageBucket",
      messagingSenderId: "अपना_senderId",
      appId: "1:अपना_senderId:web:abcdef"
    };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    getRedirectResult(auth).then((result) => {
      if (result && result.user) location.href = "index.html";
    }).catch((err) => {
      const m = document.getElementById("authMsg");
      if (m) { m.style.color = "red"; m.textContent = err.message; }
    });

    let mode = 'login';
    const title = document.getElementById('authTitle');
    const submitBtn = document.getElementById('submitBtn');
    const nameField = document.getElementById('name');
    const nameLabel = document.getElementById('nameLabel');
    const switchText = document.getElementById('switchText');
    const switchBtn = document.getElementById('switchBtn');
    const msg = document.getElementById('authMsg');

    switchBtn.onclick = (e) => {
      e.preventDefault();
      mode = mode === 'login' ? 'signup' : 'login';
      if (mode === 'signup') {
        title.textContent = 'साइनअप करें';
        submitBtn.textContent = 'साइनअप';
        nameField.style.display = 'block'; nameLabel.style.display = 'block';
        switchText.textContent = 'पहले से यूज़र? '; switchBtn.textContent = 'लॉगिन';
      } else {
        title.textContent = 'लॉगिन करें';
        submitBtn.textContent = 'लॉगिन';
        nameField.style.display = 'none'; nameLabel.style.display = 'none';
        switchText.textContent = 'नया यूज़र? '; switchBtn.textContent = 'साइनअप';
      }
    };

    document.getElementById('authForm').onsubmit = async (e) => {
      e.preventDefault();
      msg.textContent = 'कृपया प्रतीक्षा करें...'; msg.style.color = '#666';
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      try {
        if (mode === 'login') {
          await signInWithEmailAndPassword(auth, email, password);
        } else {
          const cred = await createUserWithEmailAndPassword(auth, email, password);
          if (nameField.value) await updateProfile(cred.user, { displayName: nameField.value });
        }
        msg.style.color = 'green'; msg.textContent = '✅ सफल! रीडायरेक्ट...';
        setTimeout(() => location.href = 'index.html', 800);
      } catch (err) {
        msg.style.color = 'red'; msg.textContent = 'त्रुटि: ' + err.message;
      }
    };

    document.getElementById('googleBtn').onclick = async () => {
      try { await signInWithRedirect(auth, provider); }
      catch (err) { msg.style.color = 'red'; msg.textContent = err.message; }
    };

    document.getElementById('resetBtn').onclick = async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      if (!email) { msg.style.color = 'red'; msg.textContent = 'पहले ईमेल डालें'; return; }
      try { await sendPasswordResetEmail(auth, email); msg.style.color = 'green'; msg.textContent = '✅ रीसेट लिंक भेजा गया'; }
      catch (err) { msg.style.color = 'red'; msg.textContent = err.message; }
    };
  </script>
</body>
</html>
