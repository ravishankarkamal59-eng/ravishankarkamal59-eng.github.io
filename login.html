<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>लॉगिन / साइनअप - भारत घूमो</title>
  <meta name="description" content="भारत घूमो पर लॉगिन करें और बुकिंग, ऑफर और पर्सनल ट्रैवल प्लान पाएँ।">
  <link rel="canonical" href="https://ravishankarkamal59-eng.github.io/login.html">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <a href="#main" class="skip-link">मुख्य सामग्री पर जाएँ</a>
  <header>
    <nav aria-label="मुख्य नेविगेशन">
      <div class="logo">🌏 भारत घूमो</div>
      <ul class="nav-links">
        <li><a href="index.html">होम</a></li>
      </ul>
    </nav>
  </header>
  <main id="main">
    <section class="content auth-box">
      <h1 id="authTitle">लॉगिन करें</h1>
      <p id="authMsg" class="auth-msg"></p>
      <form id="authForm">
        <label for="email">ईमेल</label>
        <input type="email" id="email" required autocomplete="email">
        <label for="password">पासवर्ड</label>
        <input type="password" id="password" required autocomplete="current-password">
        <label for="name" id="nameLabel" style="display:none">नाम</label>
        <input type="text" id="name" style="display:none" autocomplete="name">
        <button type="submit" class="btn" id="submitBtn">लॉगिन</button>
      </form>
      <p class="auth-switch">
        <span id="switchText">नया यूज़र? </span>
        <a href="#" id="switchBtn">साइनअप करें</a>
      </p>
      <p class="auth-switch"><a href="#" id="resetBtn">पासवर्ड भूल गए?</a></p>
      <button id="googleBtn" class="btn btn-google">Google से लॉगिन</button>
    </section>
  </main>
  <footer><p>© 2026 भारत घूमो</p></footer>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signInWithPopup, GoogleAuthProvider, sendPasswordResetEmail, updateProfile } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    const firebaseConfig = {
      apiKey: "AIzaSyDEMO_REPLACE_ME",
      authDomain: "bharat-ghumo.firebaseapp.com",
      projectId: "bharat-ghumo",
      storageBucket: "bharat-ghumo.appspot.com",
      messagingSenderId: "000000000000",
      appId: "1:000000000000:web:abcdef"
    };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    let mode = 'login';
    const title = document.getElementById('authTitle');
    const submitBtn = document.getElementById('submitBtn');
    const nameField = document.getElementById('name');
    const nameLabel = document.getElementById('nameLabel');
    const switchText = document.getElementById('switchText');
    const switchBtn = document.getElementById('switchBtn');
    const msg = document.getElementById('authMsg');

    switchBtn.onclick = (e) => {
      e.preventDefault();
      mode = mode === 'login' ? 'signup' : 'login';
      if (mode === 'signup') {
        title.textContent = 'साइनअप करें';
        submitBtn.textContent = 'साइनअप';
        nameField.style.display = 'block'; nameLabel.style.display = 'block';
        switchText.textContent = 'पहले से यूज़र? '; switchBtn.textContent = 'लॉगिन करें';
      } else {
        title.textContent = 'लॉगिन करें';
        submitBtn.textContent = 'लॉगिन';
        nameField.style.display = 'none'; nameLabel.style.display = 'none';
        switchText.textContent = 'नया यूज़र? '; switchBtn.textContent = 'साइनअप करें';
      }
    };

    document.getElementById('authForm').onsubmit = async (e) => {
      e.preventDefault();
      msg.textContent = 'कृपया प्रतीक्षा करें...';
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      try {
        if (mode === 'login') {
          await signInWithEmailAndPassword(auth, email, password);
        } else {
          const cred = await createUserWithEmailAndPassword(auth, email, password);
          const name = nameField.value;
          if (name) await updateProfile(cred.user, { displayName: name });
        }
        msg.style.color = 'green'; msg.textContent = 'सफल! रीडायरेक्ट हो रहा है...';
        setTimeout(() => location.href = 'index.html', 800);
      } catch (err) {
        msg.style.color = 'red'; msg.textContent = 'त्रुटि: ' + err.message;
      }
    };

    document.getElementById('googleBtn').onclick = async () => {
      try { await signInWithPopup(auth, provider); location.href = 'index.html'; }
      catch (err) { msg.style.color = 'red'; msg.textContent = err.message; }
    };

    document.getElementById('resetBtn').onclick = async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      if (!email) { msg.textContent = 'पहले ईमेल डालें'; return; }
      try { await sendPasswordResetEmail(auth, email); msg.style.color = 'green'; msg.textContent = 'रीसेट लिंक ईमेल पर भेजा गया'; }
      catch (err) { msg.style.color = 'red'; msg.textContent = err.message; }
    };
  </script>
</body>
</html>
